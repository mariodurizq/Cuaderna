<style>
/* Layout: fixed ledger-style sidebar + one working column; tables carry the page, numbers right-aligned in tabular figures. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#15201f; --muted:#5d6b69; --line:#d9e0de;
  --accent:#0d5f66; --accent-ink:#ffffff; --accent-soft:#e1efef;
  --good:#1c7a3e; --warn:#9a5d00; --bad:#b3302f;
  --good-soft:#e3f3e8; --warn-soft:#fbefd9; --bad-soft:#fae5e4;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e3e8e6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#171f1e; --ink:#e8eeec; --muted:#9aa8a5; --line:#2a3533;
    --accent:#5cc4cb; --accent-ink:#06282b; --accent-soft:#16383b;
    --good:#5fce85; --warn:#f0b04a; --bad:#f08a86;
    --good-soft:#173524; --warn-soft:#3a2c10; --bad-soft:#3d1d1c;
    --s1:#3987e5; --s2:#d95926; --grid:#27312f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171f1e; --ink:#e8eeec; --muted:#9aa8a5; --line:#2a3533;
  --accent:#5cc4cb; --accent-ink:#06282b; --accent-soft:#16383b;
  --good:#5fce85; --warn:#f0b04a; --bad:#f08a86;
  --good-soft:#173524; --warn-soft:#3a2c10; --bad-soft:#3d1d1c;
  --s1:#3987e5; --s2:#d95926; --grid:#27312f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
aside{overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.brand{font:700 22px/1 var(--display);padding:0 8px;letter-spacing:-.01em}
.brand small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:6px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px}
nav a{padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--accent-soft)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:18px}
h1{font:700 26px/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:600 17px/1.2 var(--display);margin:0;text-wrap:balance}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
tr.sub td{background:var(--bg);font-weight:600}
tr.eh td{background:var(--bg);font-weight:500}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--accent-soft);color:var(--accent)}
button,.btn{font:500 14px var(--body);padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}
button.link{white-space:nowrap;border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:400 14px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:13.5px;max-width:75ch}
#modal{position:fixed;inset:0;background:rgba(10,20,20,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:10}
#modal.open{display:flex}
.dlg{background:var(--surface);border-radius:10px;padding:20px;width:min(860px,100%);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.dlg.sm{width:min(460px,100%)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--body)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
.inv{background:#fff;color:#111;padding:28px;border:1px solid var(--line);border-radius:6px}
.inv table th,.inv table td{border-color:#ddd;color:#111}
.inv .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.inv h3{font:700 22px var(--display);margin:0 0 6px}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  nav{flex-direction:row;overflow-x:auto} nav a{white-space:nowrap} nav .sep{display:none}
  main{padding:16px}
}
@media print{
  body *{visibility:hidden} .inv,.inv *{visibility:visible}
  #modal{position:static;background:none;padding:0;display:block} .dlg{border:0;padding:0}
  .inv{border:0;position:absolute;left:0;top:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div class="brand">Cuaderna<small id="co-name"></small></div>

<script>
/*CORE-START*/
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const pad=(n,l)=>String(n).padStart(l,'0');
const PGC=[["100","Capital social"],["102","Capital"],["112","Reserva legal"],["113","Reservas voluntarias"],["120","Remanente"],["121","Resultados negativos de ejercicios anteriores"],["129","Resultado del ejercicio"],["170","Deudas a largo plazo con entidades de crédito"],
["213","Maquinaria"],["216","Mobiliario"],["217","Equipos para procesos de información"],["218","Elementos de transporte"],["281","Amortización acumulada del inmovilizado material"],
["300","Mercaderías"],["400","Proveedores"],["410","Acreedores por prestaciones de servicios"],["430","Clientes"],["465","Remuneraciones pendientes de pago"],["4700","HP, deudora por IVA"],
["472","HP, IVA soportado"],["473","HP, retenciones y pagos a cuenta"],["4750","HP, acreedora por IVA"],["4751","HP, acreedora por retenciones practicadas"],["4752","HP, acreedora por impuesto sobre sociedades"],
["476","Organismos de la Seguridad Social, acreedores"],["477","HP, IVA repercutido"],["520","Deudas a corto plazo con entidades de crédito"],["550","Titular de la explotación"],
["570","Caja, euros"],["600","Compras de mercaderías"],["621","Arrendamientos y cánones"],["622","Reparaciones y conservación"],["623","Servicios de profesionales independientes"],
["624","Transportes"],["625","Primas de seguros"],["626","Servicios bancarios"],["627","Publicidad y relaciones públicas"],["628","Suministros"],["629","Otros servicios"],
["630","Impuesto sobre beneficios"],["631","Otros tributos"],["640","Sueldos y salarios"],["642","Seguridad Social a cargo de la empresa"],["662","Intereses de deudas"],["681","Amortización del inmovilizado material"],
["700","Ventas de mercaderías"],["705","Prestaciones de servicios"],["759","Ingresos por servicios diversos"],["769","Otros ingresos financieros"]];
function blank(year){return{v:1,seq:1,year,sample:false,company:{name:"Mi empresa",nif:"",address:"",type:"autonomo"},
  accounts:PGC.map(([code,name])=>({code,name})),contacts:[],invoices:[],entries:[],banks:[],assets:[],budgets:{},items:[],moves:[],docs:[],contracts:[],opps:[],projects:[],staff:[],templates:defTemplates()};}
function defTemplates(){const T=(name,accs)=>({id:"t"+name.length+accs.length+accs[0],name,concept:name,lines:accs.map(a=>({acc:a,d:0,c:0}))});
  return[T("Nómina del mes (devengo)",["640","642","4751","476","465"]),T("Pago de nóminas",["465","57201"]),T("Pago de seguros sociales",["476","57201"]),T("Pago de la liquidación de IVA",["4750","57201"]),
    T("Pago de retenciones a Hacienda",["4751","57201"]),T("Cuota de préstamo",["520","662","57201"]),T("Comisión bancaria",["626","57201"]),T("Impuesto sobre Sociedades (devengo)",["630","4752"]),T("Aplicación del resultado",["129","112","113"])];}
function invTotals(inv){let base=0,vat=0;const byRate={};
  for(const l of inv.lines){const b=r2(l.qty*l.price),v=r2(b*l.vat/100);base+=b;vat+=v;
    const k=byRate[l.vat]||(byRate[l.vat]={base:0,vat:0});k.base=r2(k.base+b);k.vat=r2(k.vat+v);}
  base=r2(base);vat=r2(vat);const irpf=r2(base*(inv.irpf||0)/100);
  return{base,vat,irpf,total:r2(base+vat-irpf),byRate};}
function addEntry(S,date,concept,lines,src){
  const e={id:S.seq++,date,concept,src:src||"",lines:lines.map(l=>({acc:l.acc,d:r2(l.d||0),c:r2(l.c||0),contact:l.contact||null})).filter(l=>l.d||l.c)};
  S.entries.push(e);return e;}
function dropEntries(S,src){S.entries=S.entries.filter(e=>e.src!==src);}
function postInvoice(S,inv){const t=invTotals(inv);dropEntries(S,"inv:"+inv.id);
  const c=S.contacts.find(x=>x.id===inv.contactId),who=c?c.name:"";
  if(inv.kind==="emitida")addEntry(S,inv.date,"Factura "+inv.number+" "+who,[{acc:"430",d:t.total,contact:inv.contactId},{acc:"473",d:t.irpf},{acc:inv.account,c:t.base},{acc:"477",c:t.vat}],"inv:"+inv.id);
  else addEntry(S,inv.date,"Factura recibida "+inv.number+" "+who,[{acc:inv.account,d:t.base},{acc:"472",d:t.vat},{acc:"400",c:t.total,contact:inv.contactId},{acc:"4751",c:t.irpf}],"inv:"+inv.id);}
function payInvoice(S,inv,date,bankAcc){const t=invTotals(inv);dropEntries(S,"pay:"+inv.id);
  if(inv.kind==="emitida")addEntry(S,date,"Cobro factura "+inv.number,[{acc:bankAcc,d:t.total},{acc:"430",c:t.total,contact:inv.contactId}],"pay:"+inv.id);
  else addEntry(S,date,"Pago factura "+inv.number,[{acc:"400",d:t.total,contact:inv.contactId},{acc:bankAcc,c:t.total}],"pay:"+inv.id);
  inv.paid=date;inv.bank=bankAcc;}
function unpayInvoice(S,inv){dropEntries(S,"pay:"+inv.id);inv.paid=null;inv.bank=null;}
function balances(S,from,to,skip){const m={};for(const e of S.entries){if((from&&e.date<from)||(to&&e.date>to)||(skip&&[].concat(skip).some(p=>e.src.startsWith(p))))continue;
  for(const l of e.lines){const b=m[l.acc]||(m[l.acc]={d:0,c:0});b.d=r2(b.d+l.d);b.c=r2(b.c+l.c);}}return m;}
function pnl(S,from,to){const m=balances(S,from,to,"reg:");const inc=[],exp=[];let ti=0,te=0;
  for(const code of Object.keys(m).sort()){const b=m[code];
    if(code[0]==="7"){const v=r2(b.c-b.d);inc.push({code,v});ti=r2(ti+v);}
    if(code[0]==="6"){const v=r2(b.d-b.c);exp.push({code,v});te=r2(te+v);}}
  return{inc,exp,ti,te,result:r2(ti-te)};}
const BSD=[["A","A) ACTIVO NO CORRIENTE",[["I. Inmovilizado intangible",["20","280","290"]],["II. Inmovilizado material",["21","23","281","291","2"]],["III. Inversiones inmobiliarias",["22","282","292"]],["V. Inversiones financieras a largo plazo",["24","25","26"]],["VI. Activos por impuesto diferido",["474"]]]],
 ["A","B) ACTIVO CORRIENTE",[["I. Existencias",["3"]],["II. Deudores comerciales y otras cuentas a cobrar",["43","44","460","470","471","472","473"]],["IV. Inversiones financieras a corto plazo",["53","54"]],["V. Periodificaciones a corto plazo",["480","567"]],["VI. Efectivo y otros activos líquidos equivalentes",["57"]]]],
 ["P","A) PATRIMONIO NETO",[["I. Capital",["10"]],["III. Reservas",["11"]],["V. Resultados de ejercicios anteriores",["12"]],["VI. Otras aportaciones y cuenta del titular",["118","55"]],["VII. Resultado del ejercicio",["129","6","7"]],["Subvenciones y ajustes",["13","8","9"]]]],
 ["P","B) PASIVO NO CORRIENTE",[["I. Provisiones a largo plazo",["14"]],["II. Deudas a largo plazo",["1"]],["IV. Pasivos por impuesto diferido",["479"]]]],
 ["P","C) PASIVO CORRIENTE",[["II. Deudas a corto plazo",["5"]],["IV. Acreedores comerciales y otras cuentas a pagar",["4"]],["V. Periodificaciones a corto plazo",["485","568"]]]]];
function bsAt(code){let best=null,bl=-1;BSD.forEach((sec,si)=>sec[2].forEach((ln,li)=>{for(const p of ln[1])if(code.startsWith(p)&&p.length>bl){bl=p.length;best=[si,li];}}));return best;}
function balanceSheet(S,to){const m=balances(S,null,to,"cie:"+to.slice(0,4));
  const secs=BSD.map(x=>({side:x[0],title:x[1],total:0,lines:x[2].map(l=>({label:l[0],v:0,accs:[]}))}));
  for(const code of Object.keys(m).sort()){const at=bsAt(code);if(!at)continue;const sec=secs[at[0]],ln=sec.lines[at[1]],v=sec.side==="A"?r2(m[code].d-m[code].c):r2(m[code].c-m[code].d);if(!v)continue;
    ln.v=r2(ln.v+v);sec.total=r2(sec.total+v);const pend=code[0]==="6"||code[0]==="7",key=pend?"—":code;let a=ln.accs.find(x=>x.code===key);
    if(!a){a={code:key,v:0,label:pend?"Ingresos menos gastos pendientes de regularizar":null};ln.accs.push(a);}a.v=r2(a.v+v);}
  const sum=k=>r2(secs.filter(x=>x.side===k).reduce((a,x)=>a+x.total,0));return{secs,activo:sum("A"),pasivo:sum("P")};}
const PLD=[["1. Importe neto de la cifra de negocios",["70"]],["2. Variación de existencias de productos terminados y en curso",["71"]],["3. Trabajos realizados por la empresa para su activo",["73"]],["4. Aprovisionamientos",["60","61"]],["5. Otros ingresos de explotación",["74","75"]],["6. Gastos de personal",["64"]],["7. Otros gastos de explotación",["62","63","65","6","7"]],["8. Amortización del inmovilizado",["68"]],["11. Deterioro y resultado por enajenaciones del inmovilizado",["67","69","77","79"]],
 "A) RESULTADO DE EXPLOTACIÓN",["12. Ingresos financieros",["76"]],["13. Gastos financieros",["66"]],"B) RESULTADO FINANCIERO","C) RESULTADO ANTES DE IMPUESTOS",["17. Impuesto sobre beneficios",["630","633","638"]],"D) RESULTADO DEL EJERCICIO"];
function pnlOfficial(S,y){const m=balances(S,y+"-01-01",y+"-12-31","reg:"),rows=PLD.map(l=>typeof l==="string"?{title:l,v:0}:{label:l[0],v:0,accs:[]});
  for(const code of Object.keys(m).sort()){if(code[0]!=="6"&&code[0]!=="7")continue;let bi=-1,bl=-1;PLD.forEach((l,i)=>{if(typeof l!=="string")for(const p of l[1])if(code.startsWith(p)&&p.length>bl){bl=p.length;bi=i;}});
    const v=r2(m[code].c-m[code].d);if(!v)continue;rows[bi].v=r2(rows[bi].v+v);rows[bi].accs.push({code,v});}
  let ex=0,fin=0,tax=0;rows.forEach((r,i)=>{if(r.title)return;if(i<9)ex=r2(ex+r.v);else if(i<12)fin=r2(fin+r.v);else tax=r2(tax+r.v);});
  rows[9].v=ex;rows[12].v=fin;rows[13].v=r2(ex+fin);rows[15].v=r2(ex+fin+tax);return rows;}
function qRange(y,q){const m0=(q-1)*3+1,m1=m0+2,last=new Date(y,m1,0).getDate();return[y+"-"+pad(m0,2)+"-01",y+"-"+pad(m1,2)+"-"+pad(last,2)];}
function invIn(S,kind,from,to){return S.invoices.filter(i=>i.kind===kind&&i.date>=from&&i.date<=to);}
function tax303(S,y,q){const[f,t]=qRange(y,q);const acc=list=>{const r={};let b=0,v=0;
  for(const i of list){const x=invTotals(i);for(const k in x.byRate){const o=r[k]||(r[k]={base:0,vat:0});o.base=r2(o.base+x.byRate[k].base);o.vat=r2(o.vat+x.byRate[k].vat);}b=r2(b+x.base);v=r2(v+x.vat);}
  return{rates:r,base:b,vat:v};};
  const dev=acc(invIn(S,"emitida",f,t)),sop=acc(invIn(S,"recibida",f,t));return{dev,sop,result:r2(dev.vat-sop.vat)};}
function tax130(S,y,q){const[,t]=qRange(y,q),f=y+"-01-01";let ing=0,gas=0,ret=0;
  for(const i of invIn(S,"emitida",f,t)){const x=invTotals(i);ing=r2(ing+x.base);ret=r2(ret+x.irpf);}
  for(const i of invIn(S,"recibida",f,t))gas=r2(gas+invTotals(i).base);
  const rend=r2(ing-gas),cuota=r2(Math.max(0,rend)*0.2);let prev=0;
  for(let k=1;k<q;k++)prev=r2(prev+Math.max(0,tax130(S,y,k).result));
  return{ing,gas,rend,cuota,ret,prev,result:r2(cuota-ret-prev)};}
function tax111(S,y,q){const[f,t]=qRange(y,q);let base=0,ret=0,n=0,wb=0,wr=0;
  for(const i of invIn(S,"recibida",f,t)){if(i.account==="621")continue;const x=invTotals(i);if(x.irpf){base=r2(base+x.base);ret=r2(ret+x.irpf);n++;}}
  for(const e of S.entries)if(e.src.startsWith("nom:")&&e.date>=f&&e.date<=t)for(const l of e.lines){if(l.acc==="640")wb=r2(wb+l.d);if(l.acc==="4751")wr=r2(wr+l.c);}
  return{base,ret,n,wb,wr,total:r2(ret+wr)};}

function status(i){if(i.paid)return`<span class="pill good">${i.kind==="emitida"?"Cobrada":"Pagada"}</span>`;

/* Panel */
function vPanel(){const[f,t]=yr();const p=pnl(S,f,t),m=balances(S,null,t,"cie:"+S.year);
  let cash=0;for(const k in m)if(k.slice(0,2)==="57")cash=r2(cash+m[k].d-m[k].c);
  const open=k=>S.invoices.filter(i=>i.kind===k&&!i.paid).reduce((a,i)=>r2(a+invTotals(i).total),0);
  const q=S.year===now.getFullYear()?Math.floor(now.getMonth()/3)+1:4,iva=tax303(S,S.year,q);
  const months=Array.from({length:12},(_,k)=>{const mm=S.year+"-"+pad(k+1,2);let a=0,b=0;
    for(const i of S.invoices){if(i.date.slice(0,7)!==mm)continue;const x=invTotals(i).base;if(i.kind==="emitida")a=r2(a+x);else b=r2(b+x);}return{a,b};});
  const due=S.invoices.filter(i=>!i.paid&&i.due&&i.due<TODAY).sort((a,b)=>a.due<b.due?-1:1);
  return`<div class="head"><h1>Panel ${S.year}</h1><div class="row"><button class="pri" data-act="inv-new" data-kind="emitida">Nueva factura</button><button data-act="inv-new" data-kind="recibida">Registrar gasto</button></div></div>
  <div class="kpis">
   <div class="kpi"><span>Ingresos</span><b>${eur(p.ti)}</b></div><div class="kpi"><span>Gastos</span><b>${eur(p.te)}</b></div>
   <div class="kpi"><span>Resultado</span><b>${eur(p.result)}</b></div><div class="kpi"><span>Tesorería</span><b>${eur(cash)}</b></div>
   <div class="kpi"><span>Pendiente de cobro</span><b>${eur(open("emitida"))}</b></div><div class="kpi"><span>Pendiente de pago</span><b>${eur(open("recibida"))}</b></div>
   <div class="kpi"><span>IVA ${q}T (${iva.result>=0?"a ingresar":"a compensar"})</span><b>${eur(Math.abs(iva.result))}</b></div>
  </div>
  <div class="grid2">
   <div class="card"><div class="head"><h2>Ingresos y gastos por mes (base imponible)</h2><div class="legend"><span><i style="background:var(--s1)"></i>Ingresos</span><span><i style="background:var(--s2)"></i>Gastos</span></div></div>
    ${chart(months)}
    <details><summary class="small muted">Ver como tabla</summary><div class="tw"><table><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Gastos</th></tr>${months.map((x,k)=>`<tr><td>${MES[k]}</td><td class="n">${eur(x.a)}</td><td class="n">${eur(x.b)}</td></tr>`).join("")}</table></div></details></div>
   <div class="card"><h2>Facturas vencidas</h2>${due.length?`<div class="tw"><table><tr><th>Factura</th><th>Contacto</th><th>Vence</th><th class="n">Importe</th></tr>${due.slice(0,10).map(i=>`<tr><td><button class="link" data-act="inv-view" data-id="${i.id}">${esc(i.number)}</button> <span class="pill ${i.kind==="emitida"?"neu":"warn"}">${i.kind==="emitida"?"A cobrar":"A pagar"}</span></td><td>${esc(contact(i.contactId).name)}</td><td>${fd(i.due)}</td><td class="n">${eur(invTotals(i).total)}</td></tr>`).join("")}</table></div>`:`<p class="muted">No hay facturas vencidas.</p>`}</div>
  </div>`;}
const MES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function chart(ms){const W=640,H=240,L=46,B=24,T=10,max=Math.max(1,...ms.map(x=>Math.max(x.a,x.b)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step,ticks=[0,top/2,top];
  const y=v=>T+(H-T-B)*(1-v/top),gw=(W-L)/12,bw=Math.min(14,gw/2-5);
  const bar=(x,v,c)=>{if(v<=0)return"";const h=H-B-y(v),r=Math.min(3,h);return`<path d="M${x},${H-B}v${-(h-r)}q0,${-r} ${r},${-r}h${bw-2*r}q${r},0 ${r},${r}v${h-r}z" fill="${c}"/>`;};
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">
  ${ticks.map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("es-ES")+" k":v}</text>`).join("")}
  ${ms.map((m,k)=>{const cx=L+gw*k+gw/2;return bar(cx-bw-1,m.a,"var(--s1)")+bar(cx+1,m.b,"var(--s2)")+`<text x="${cx}" y="${H-7}" text-anchor="middle">${MES[k]}</text><rect class="hit" data-tip="${MES[k]}: ingresos ${eur(m.a)} · gastos ${eur(m.b)}" x="${L+gw*k}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent"/>`;}).join("")}
  </svg><div id="tip"></div></div>`;}

  let tb=0,tv=0,tt=0;const rows=list.map(i=>{const t=invTotals(i);tb=r2(tb+t.base);tv=r2(tv+t.vat);tt=r2(tt+t.total);

  <div class="card"><div class="tw"><table><tr><th>Número</th><th>Fecha</th><th>${em?"Cliente":"Proveedor"}</th><th class="n">Base</th><th class="n">IVA</th><th class="n">IRPF</th><th class="n">Total</th><th>Estado</th><th></th></tr>

function accOpts(filter,sel){return S.accounts.filter(filter).map(a=>`<option value="${a.code}" ${a.code===sel?"selected":""}>${a.code} ${esc(a.name)}</option>`).join("");}
function bankOpts(sel){if(!sel){const f=S.accounts.find(a=>a.code.slice(0,3)==="572");sel=ui.bank||(f&&f.code);}return S.accounts.filter(a=>a.code.slice(0,2)==="57").map(a=>`<option value="${a.code}" ${a.code===sel?"selected":""}>${esc(a.name)}</option>`).join("");}

function readLines(){return $$("#f-lines tr").map(tr=>({desc:$(".l-desc",tr).value.trim(),qty:+$(".l-qty",tr).value||0,price:+$(".l-price",tr).value||0,vat:+$(".l-vat",tr).value,itemId:+tr.dataset.item||0})).filter(l=>l.desc||l.qty*l.price);}

  $("#f-tot").innerHTML=`Base <b>${eur(t.base)}</b> · IVA <b>${eur(t.vat)}</b>${t.irpf?` · IRPF <b>−${eur(t.irpf)}</b>`:""} · Total <b>${eur(t.total)}</b>`;}

  if(!cid){const name=$("#f-newname").value.trim();if(!name)return fail("Elige un contacto o escribe el nombre del nuevo.");

  let inv=S.invoices.find(i=>i.id===id);if(!inv){inv={id:S.seq++,kind,paid:null,bank:null};S.invoices.push(inv);}
  Object.assign(inv,{number:$("#f-number").value.trim(),date:$("#f-date").value,due:$("#f-due").value,contactId:cid,account:$("#f-account").value,irpf:+$("#f-irpf").value||0,center:$("#f-center").value.trim(),lines});
  postInvoice(S,inv);done();}

/* Listas genéricas: artículos, contratos, oportunidades, proyectos, personal */
const CR={
 articulos:{key:"items",title:"Artículos y stock",one:"artículo",f:[["code","Código","text"],["name","Descripción","text"],["price","Precio de venta","money"],["cost","Coste","money"],["vat","IVA %","select",[21,10,4,0]],["min","Stock mínimo","number"],["bom","Escandallo para fabricar (código:cantidad, código:cantidad)","text",null,1]]},
 contratos:{key:"contracts",title:"Contratos y facturación periódica",one:"contrato",f:[["concept","Concepto","text"],["contactId","Cliente","contact","cliente"],["amount","Importe por periodo, sin IVA","money"],["vat","IVA %","select",[21,10,4,0]],["every","Periodicidad","select",[["1","Mensual"],["3","Trimestral"],["12","Anual"]]],["next","Próxima factura","date"]]},
 crm:{key:"opps",title:"Oportunidades de venta",one:"oportunidad",f:[["title","Oportunidad","text"],["contactId","Cliente","contact","cliente"],["amount","Importe estimado","money"],["stage","Fase","select",["Nueva","Contactada","Propuesta enviada","Ganada","Perdida"]],["next","Próxima acción","date"],["notes","Notas","text"]]},
 proyectos:{key:"projects",title:"Proyectos",one:"proyecto",f:[["name","Nombre (el mismo que el centro de coste de las facturas)","text"],["contactId","Cliente","contact","cliente"],["budget","Presupuesto de ingresos","money"],["status","Estado","select",["En curso","En pausa","Terminado"]]]},
 personal:{key:"staff",title:"Personal y nóminas",one:"empleado",f:[["name","Nombre","text"],["nif","NIF","text"],["role","Puesto","text"],["gross","Bruto mensual","money"],["irpf","IRPF %","number"],["ssw","Seg. Social trabajador %","number"],["sse","Seg. Social empresa %","number"]]}};
function cell(f,v){const t=f[2];if(t==="money")return eur(+v);if(t==="date")return fd(v);if(t==="contact")return esc(contact(+v).name);
  if(t==="select"&&Array.isArray(f[3][0]))return esc((f[3].find(o=>o[0]==v)||["",v])[1]);return esc(v==null?"":v);}
function crudView(name,o){o=o||{};const c=CR[name],fs=c.f.filter(f=>!f[4]),nu=f=>f[2]==="money"||f[2]==="number"?"n":"";
  return`<div class="head"><h1>${c.title}</h1><div class="row">${o.top||""}<button class="pri" data-act="crud-new" data-name="${name}">Nuevo ${c.one}</button></div></div>${o.before||""}
  <div class="card"><div class="tw"><table><tr>${fs.map(f=>`<th class="${nu(f)}">${f[1].split(" (")[0].split(",")[0]}</th>`).join("")}${(o.head||[]).map(h=>`<th class="n">${h}</th>`).join("")}<th></th></tr>
  ${S[c.key].map(r=>`<tr>${fs.map(f=>`<td class="${nu(f)}">${cell(f,r[f[0]])}</td>`).join("")}${(o.cols?o.cols(r):[]).map(x=>`<td class="n">${x}</td>`).join("")}<td class="n">${o.acts?o.acts(r):""}<button class="link" data-act="crud-edit" data-name="${name}" data-id="${r.id}">Editar</button><button class="link" data-act="crud-del" data-name="${name}" data-id="${r.id}">Borrar</button></td></tr>`).join("")||`<tr><td colspan="${fs.length+(o.head||[]).length+1}" class="muted">Aún no hay datos.</td></tr>`}</table></div>${o.note?`<p class="small muted">${o.note}</p>`:""}</div>${o.after||""}`;}
function crudForm(name,id){const c=CR[name],r=S[c.key].find(x=>x.id===id)||{};
  modal(`<form class="dlg" data-form="crud" data-name="${name}"><h2>${id?"Editar":"Nuevo"} ${c.one}</h2><input type="hidden" id="k-id" value="${id||0}"><div class="form">${c.f.map((f,n)=>{const v=r[f[0]]==null?"":r[f[0]],t=f[2];let inp;
    if(t==="select")inp=`<select id="k-${f[0]}">${f[3].map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${val}" ${val==v?"selected":""}>${lab}</option>`;}).join("")}</select>`;
    else if(t==="contact")inp=`<select id="k-${f[0]}">${S.contacts.filter(x=>x.type===f[3]).map(x=>`<option value="${x.id}" ${x.id===v?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
    else inp=`<input id="k-${f[0]}" type="${t==="money"||t==="number"?"number":t}" step="any" ${n===0?"required":""} value="${esc(v)}">`;
    return`<label>${f[1]}${inp}</label>`;}).join("")}</div><div class="row" style="justify-content:flex-end"><button type="button" data-act="close">Cancelar</button><button class="pri">Guardar</button></div></form>`);}
function vArticulos(){const st=stockMap(S);let val=0,low=0;for(const i of S.items){const q=st[i.id]||0;val=r2(val+q*(i.cost||0));if(q<(i.min||0))low++;}
  const name=id=>(S.items.find(i=>i.id===id)||{name:"(borrado)"}).name;
  return crudView("articulos",{before:`<div class="kpis"><div class="kpi"><span>Valor del inventario a coste</span><b>${eur(val)}</b></div><div class="kpi"><span>Artículos bajo mínimo</span><b>${low}</b></div><div class="kpi"><span>Referencias</span><b>${S.items.length}</b></div></div>`,
   head:["Stock","Valor"],cols:i=>{const q=st[i.id]||0;return[`<b>${q.toLocaleString("es-ES")}</b> ${q<(i.min||0)?`<span class="pill bad">Bajo mínimo</span>`:""}`,eur(r2(q*(i.cost||0)))];},
   acts:i=>`<button class="link" data-act="stock-adj" data-id="${i.id}">Ajustar stock</button>${i.bom?`<button class="link" data-act="build" data-id="${i.id}">Fabricar</button>`:""}`,
   note:"El stock entra con los albaranes de compra y sale con los de venta. Un artículo con escandallo se puede fabricar: consume sus componentes y suma stock del producto.",
   after:`<div class="card"><h2>Últimos movimientos de almacén</h2><div class="tw"><table><tr><th>Fecha</th><th>Artículo</th><th>Motivo</th><th class="n">Cantidad</th></tr>${S.moves.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,15).map(m=>`<tr><td>${fd(m.date)}</td><td>${esc(name(m.itemId))}</td><td>${esc(m.ref)}</td><td class="n">${m.qty>0?"+":""}${m.qty.toLocaleString("es-ES")}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Sin movimientos.</td></tr>`}</table></div></div>`});}
function vContratos(){const due=S.contracts.filter(c=>c.next&&c.next<=TODAY).length;
  return crudView("contratos",{top:`<button data-act="contracts-run">Generar facturas pendientes (${due})</button>`,note:"Cada contrato genera una factura emitida en su fecha y avanza a la siguiente según la periodicidad."});}
function vCRM(){const st=CR.crm.f[3][3];return crudView("crm",{before:`<div class="kpis">${st.map(x=>{const l=S.opps.filter(o=>o.stage===x);return`<div class="kpi"><span>${x} (${l.length})</span><b>${eur(l.reduce((a,o)=>r2(a+(+o.amount||0)),0))}</b></div>`;}).join("")}</div>`});}
function vProyectos(){const t=p=>{let a=0,b=0;for(const i of S.invoices)if(i.center===p.name){const x=invTotals(i).base;if(i.kind==="emitida")a=r2(a+x);else b=r2(b+x);}return[a,b];};
  return crudView("proyectos",{head:["Ingresos","Gastos","Margen","Sobre presupuesto"],cols:p=>{const[a,b]=t(p);return[eur(a),eur(b),`<b>${eur(r2(a-b))}</b>`,p.budget?Math.round(a/p.budget*100)+" %":""];},note:"Los importes salen de las facturas cuyo centro de coste coincide con el nombre del proyecto."});}
function vPersonal(){const done=m=>S.entries.some(e=>e.src==="nom:"+S.year+":"+m);
  return crudView("personal",{top:`<select id="pay-month" style="width:auto" aria-label="Mes">${MES.map((n,k)=>`<option value="${k+1}" ${k===now.getMonth()?"selected":""}>${n} ${S.year}${done(k+1)?" ✓":""}</option>`).join("")}</select><button data-act="payroll-post">Contabilizar nóminas del mes</button>`,
   head:["Neto estimado","Coste empresa"],cols:e=>[eur(r2(e.gross-r2(e.gross*e.irpf/100)-r2(e.gross*e.ssw/100))),eur(r2(e.gross+r2(e.gross*e.sse/100)))],
   note:"Estimación contable: reparte el bruto con los porcentajes que indiques y crea el asiento (640, 642 a 4751, 476 y 465). No calcula nóminas legales, bases de cotización ni pagas extra, y no genera recibos de salarios ni ficheros para la Seguridad Social."});}

/* Cartera */
function vCartera(){const open=S.invoices.filter(i=>!i.paid).sort((a,b)=>(a.due||a.date)<(b.due||b.date)?-1:1);
  const bk=i=>{const d=i.due||i.date;if(d<TODAY)return 0;const n=(new Date(d)-new Date(TODAY))/864e5;return n<=30?1:n<=60?2:3;};
  const names=["Vencido","Hasta 30 días","31 a 60 días","Más de 60 días"],tot={emitida:[0,0,0,0],recibida:[0,0,0,0]};
  for(const i of open)tot[i.kind][bk(i)]=r2(tot[i.kind][bk(i)]+invTotals(i).total);
  const sum=a=>r2(a.reduce((x,y)=>x+y,0)),line=(n,a)=>`<tr><td>${n}</td>${a.map(v=>`<td class="n">${eur(v)}</td>`).join("")}<td class="n"><b>${eur(sum(a))}</b></td></tr>`;
  return`<div class="head"><h1>Cartera de cobros y pagos</h1><button data-act="tbl-csv">Exportar a Excel (.csv)</button></div>
  <div class="card"><h2>Previsión por vencimiento</h2><div class="tw"><table><tr><th></th>${names.map(n=>`<th class="n">${n}</th>`).join("")}<th class="n">Total</th></tr>${line("A cobrar",tot.emitida)+line("A pagar",tot.recibida)}
  <tr class="tot"><td>Neto previsto</td>${tot.emitida.map((v,k)=>`<td class="n">${eur(r2(v-tot.recibida[k]))}</td>`).join("")}<td class="n">${eur(r2(sum(tot.emitida)-sum(tot.recibida)))}</td></tr></table></div></div>
  <div class="card"><h2>Efectos pendientes</h2><div class="tw"><table><tr><th>Vence</th><th>Factura</th><th>Contacto</th><th>Tipo</th><th class="n">Importe</th><th>Estado</th><th></th></tr>
  ${open.map(i=>`<tr><td>${fd(i.due||i.date)}</td><td><button class="link" data-act="inv-view" data-id="${i.id}">${esc(i.number)}</button></td><td>${esc(contact(i.contactId).name)}</td><td><span class="pill ${i.kind==="emitida"?"neu":"warn"}">${i.kind==="emitida"?"Cobro":"Pago"}</span></td><td class="n">${eur(invTotals(i).total)}</td><td>${status(i)}</td><td class="n"><button class="link" data-act="inv-pay" data-id="${i.id}">${i.kind==="emitida"?"Cobrar":"Pagar"}</button></td></tr>`).join("")||`<tr><td colspan="7" class="muted">No hay cobros ni pagos pendientes.</td></tr>`}</table></div></div>`;}

/* Activos fijos */
function vActivos(){const y=S.year;let tc=0,ta=0;
  const rows=S.assets.map(a=>{const ac=assetPosted(S,a),d=assetDep(a,y),ok=S.entries.some(e=>e.src==="amo:"+a.id+":"+y);tc=r2(tc+a.cost);ta=r2(ta+ac);
    return`<tr><td><b>${esc(a.name)}</b></td><td>${a.acc} ${esc(accName(a.acc))}</td><td>${fd(a.date)}</td><td class="n">${eur(a.cost)}</td><td class="n">${a.years} años</td><td class="n">${eur(d)} ${d?(ok?`<span class="pill good">Contabilizada</span>`:`<span class="pill warn">Pendiente</span>`):""}</td><td class="n">${eur(ac)}</td><td class="n"><b>${eur(r2(a.cost-ac))}</b></td><td class="n"><button class="link" data-act="asset-del" data-id="${a.id}">Borrar</button></td></tr>`;}).join("");
  return`<div class="head"><h1>Activos fijos</h1><div class="row"><button data-act="dep-post">Contabilizar amortización ${y}</button><button class="pri" data-act="asset-new">Nuevo activo</button></div></div>
  <div class="card"><div class="tw"><table><tr><th>Activo</th><th>Cuenta</th><th>Alta</th><th class="n">Coste</th><th class="n">Vida útil</th><th class="n">Cuota ${y}</th><th class="n">Amortizado</th><th class="n">Valor neto</th><th></th></tr>${rows||`<tr><td colspan="9" class="muted">Aún no hay activos.</td></tr>`}
  ${S.assets.length?`<tr class="tot"><td colspan="3">Total</td><td class="n">${eur(tc)}</td><td colspan="2"></td><td class="n">${eur(ta)}</td><td class="n">${eur(r2(tc-ta))}</td><td></td></tr>`:""}</table></div>
  <p class="small muted">Amortización lineal, prorrateada por días el año de alta, con asiento 681 a 281 a 31 de diciembre. Dar de alta un activo no contabiliza su compra: regístrala como factura recibida con una cuenta del grupo 2.</p></div>`;}

/* Presupuesto */
function vPresupuesto(){const y=S.year,b=S.budgets[y]||{},[f,t]=yr(),m=balances(S,f,t,"reg:");let pi=0,ri=0,pe=0,re=0;
  const row=a=>{const inc=a.code[0]==="7",x=m[a.code]||{d:0,c:0},real=inc?r2(x.c-x.d):r2(x.d-x.c),p=b[a.code]||0;if(inc){pi=r2(pi+p);ri=r2(ri+real);}else{pe=r2(pe+p);re=r2(re+real);}
    const good=inc?real>=p:real<=p;
    return`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="n" style="width:150px"><input class="bud" type="number" step="any" min="0" data-acc="${a.code}" value="${p||""}" aria-label="Presupuesto ${a.code}" style="text-align:right"></td><td class="n">${eur(real)}</td><td class="n">${p?eur(r2(real-p)):""}</td><td class="n">${p?`<span class="pill ${good?"good":"bad"}">${Math.round(real/p*100)} %</span>`:""}</td></tr>`;};
  const inc=S.accounts.filter(a=>a.code[0]==="7").map(row).join(""),exp=S.accounts.filter(a=>a.code[0]==="6").map(row).join("");
  return`<div class="head"><h1>Presupuesto ${y}</h1></div><div class="card"><div class="tw"><table><tr><th>Cuenta</th><th>Nombre</th><th class="n">Presupuesto anual</th><th class="n">Real</th><th class="n">Desviación</th><th class="n">Ejecutado</th></tr>
  <tr class="sub"><td colspan="2">Ingresos</td><td class="n">${eur(pi)}</td><td class="n">${eur(ri)}</td><td class="n">${eur(r2(ri-pi))}</td><td></td></tr>${inc}
  <tr class="sub"><td colspan="2">Gastos</td><td class="n">${eur(pe)}</td><td class="n">${eur(re)}</td><td class="n">${eur(r2(re-pe))}</td><td></td></tr>${exp}
  <tr class="tot"><td colspan="2">Resultado</td><td class="n">${eur(r2(pi-pe))}</td><td class="n">${eur(r2(ri-re))}</td><td class="n">${eur(r2(ri-re-pi+pe))}</td><td></td></tr></table></div>
  <p class="small muted">Escribe el importe anual previsto en cada cuenta; se guarda al salir de la casilla.</p></div>`;}

/* Contactos */
function vContacts(){const rows=S.contacts.map(c=>{const n=S.invoices.filter(i=>i.contactId===c.id),open=n.filter(i=>!i.paid).reduce((a,i)=>r2(a+invTotals(i).total),0);
  return`<tr><td><b>${esc(c.name)}</b></td><td><span class="pill ${c.type==="cliente"?"neu":"warn"}">${c.type==="cliente"?"Cliente":"Proveedor"}</span></td><td>${esc(c.nif)}</td><td>${esc(c.email||"")}</td><td class="n">${n.length}</td><td class="n">${eur(open)}</td><td class="n"><button class="link" data-act="con-edit" data-id="${c.id}">Editar</button><button class="link" data-act="con-del" data-id="${c.id}">Borrar</button></td></tr>`;}).join("");
  return`<div class="head"><h1>Clientes y proveedores</h1><button class="pri" data-act="con-edit" data-id="0">Nuevo contacto</button></div>
  <div class="card"><div class="tw"><table><tr><th>Nombre</th><th>Tipo</th><th>NIF</th><th>Correo</th><th class="n">Facturas</th><th class="n">Saldo pendiente</th><th></th></tr>${rows||`<tr><td colspan="7" class="muted">Aún no hay contactos.</td></tr>`}</table></div></div>`;}
function conForm(id){const c=S.contacts.find(x=>x.id===id)||{id:0,type:"cliente",name:"",nif:"",address:"",email:""};
  modal(`<form class="dlg sm" data-form="contact"><h2>${id?"Editar":"Nuevo"} contacto</h2><input type="hidden" id="c-id" value="${c.id}">
  <div class="form"><label>Tipo<select id="c-type"><option value="cliente" ${c.type==="cliente"?"selected":""}>Cliente</option><option value="proveedor" ${c.type==="proveedor"?"selected":""}>Proveedor</option></select></label>
  <label>Nombre o razón social<input id="c-name" required value="${esc(c.name)}"></label><label>NIF<input id="c-nif" value="${esc(c.nif)}"></label><label>Correo<input id="c-email" value="${esc(c.email||"")}"></label><label>Dirección<input id="c-address" value="${esc(c.address||"")}"></label></div>
  <div class="row" style="justify-content:flex-end"><button type="button" data-act="close">Cancelar</button><button class="pri">Guardar</button></div></form>`);}

/* Diario */
function vDiario(){const es=S.entries.filter(inYear).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);let td=0,tc=0;
  const rows=es.map((e,k)=>{const TAG={inv:["neu","Factura"],pay:["good","Cobro/pago"],iva:["warn","Liquidación IVA"],reg:["warn","Regularización"],cie:["warn","Cierre"],ape:["warn","Apertura"],nom:["warn","Nómina"],amo:["warn","Amortización"]}[e.src.slice(0,3)];
    const tag=(TAG?`<span class="pill ${TAG[0]}">${TAG[1]}</span> `:"")+(!e.src?`<button class="link" data-act="ent-dup" data-id="${e.id}">Duplicar</button>`:"")+(/^(inv|pay|reg|cie|ape)/.test(e.src)?"":`<button class="link" data-act="ent-del" data-id="${e.id}">Borrar</button>`);
    return`<tr class="eh"><td>${k+1}</td><td>${fd(e.date)}</td><td colspan="2">${esc(e.concept)}</td><td class="n" colspan="2">${tag}</td></tr>`+e.lines.map(l=>{td=r2(td+l.d);tc=r2(tc+l.c);
      return`<tr><td></td><td></td><td>${l.acc}</td><td>${esc(accName(l.acc))}${l.contact?` <span class="muted">· ${esc(contact(l.contact).name)}</span>`:""}</td><td class="n">${l.d?eur(l.d):""}</td><td class="n">${l.c?eur(l.c):""}</td></tr>`;}).join("");}).join("");
  return`<div class="head"><h1>Libro diario ${S.year}</h1><div class="row"><button data-act="tbl-csv">Exportar a Excel (.csv)</button>${S.entries.some(e=>e.src==="reg:"+S.year||e.src==="cie:"+S.year)?`<span class="pill good">Ejercicio cerrado</span><button data-act="year-open">Deshacer cierre</button>`:`<button data-act="year-close">Cerrar ejercicio ${S.year}</button>`}<button class="pri" data-act="ent-new">Nuevo asiento manual</button></div></div>
  <div class="card"><div class="tw"><table><tr><th>Nº</th><th>Fecha</th><th>Cuenta</th><th>Concepto</th><th class="n">Debe</th><th class="n">Haber</th></tr>${rows||`<tr><td colspan="6" class="muted">Sin asientos.</td></tr>`}
  <tr class="tot"><td colspan="4">Totales</td><td class="n">${eur(td)}</td><td class="n">${eur(tc)}</td></tr></table></div></div>`;}
function entRow(l){l=l||{};return`<tr><td><select class="e-acc" aria-label="Cuenta">${accOpts(()=>true,l.acc)}</select></td><td style="width:130px"><input class="e-d" type="number" step="any" min="0" value="${l.d||""}" aria-label="Debe"></td><td style="width:130px"><input class="e-c" type="number" step="any" min="0" value="${l.c||""}" aria-label="Haber"></td><td style="width:40px"><button type="button" class="link" data-act="eline-del" aria-label="Quitar línea">✕</button></td></tr>`;}
function entForm(pre){pre=pre||{concept:"",lines:[{},{}]};modal(`<form class="dlg" data-form="entry"><h2>Nuevo asiento manual</h2>
  <div class="form"><label>Plantilla<select id="e-tpl"><option value="">Usar plantilla…</option>${S.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Fecha<input id="e-date" type="date" required value="${TODAY}"></label><label>Concepto<input id="e-concept" required value="${esc(pre.concept)}"></label></div>
  <div class="tw"><table><thead><tr><th>Cuenta</th><th>Debe</th><th>Haber</th><th></th></tr></thead><tbody id="e-lines">${pre.lines.map(entRow).join("")}</tbody></table></div>
  <div class="row" style="justify-content:space-between"><button type="button" data-act="ent-line">Añadir línea</button><div id="e-tot" class="small"></div></div>
  <details><summary class="small muted">Crear una cuenta nueva sin salir del asiento</summary><div class="row" style="margin-top:8px"><input id="e-ncode" placeholder="Código" style="width:120px" aria-label="Código de la cuenta nueva"><input id="e-nname" placeholder="Nombre de la cuenta" style="flex:1;min-width:180px;width:auto" aria-label="Nombre de la cuenta nueva"><button type="button" data-act="acc-quick">Crear cuenta</button></div></details>
  <label style="flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)"><input id="e-save" type="checkbox" style="width:auto">Guardar también como plantilla, con el concepto como nombre</label>
  <div class="err" id="f-err"></div><div class="row" style="justify-content:flex-end"><button type="button" data-act="tpl-del">Borrar la plantilla elegida</button><button type="button" data-act="close">Cancelar</button><button class="pri">Guardar asiento</button></div></form>`);updEnt();}
function readEnt(){return $$("#e-lines tr").map(tr=>({acc:$(".e-acc",tr).value,d:+$(".e-d",tr).value||0,c:+$(".e-c",tr).value||0})).filter(l=>l.d||l.c);}
function updEnt(){if(!$("#e-tot"))return;const ls=readEnt(),d=r2(ls.reduce((a,l)=>a+l.d,0)),c=r2(ls.reduce((a,l)=>a+l.c,0));
  $("#e-tot").innerHTML=`Debe <b>${eur(d)}</b> · Haber <b>${eur(c)}</b> · ${d===c?`<span class="pill good">Cuadrado</span>`:`<span class="pill bad">Descuadre ${eur(r2(d-c))}</span>`}`;}

/* Informes */
function vInformes(){const[f,t]=yr();const tabs=[["sumas","Sumas y saldos"],["mayor","Libro mayor"],["situacion","Balance de situación"],["pyg","Pérdidas y ganancias"],["iva","Libros de IVA"],["analitica","Analítica"],["plan","Plan de cuentas"]];

  if(ui.rep==="mayor"){let s=0;const rows=[];for(const e of S.entries.filter(inYear).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id))for(const l of e.lines)if(l.acc===ui.mayor){s=r2(s+l.d-l.c);rows.push(`<tr><td>${fd(e.date)}</td><td>${esc(e.concept)}</td><td class="n">${l.d?eur(l.d):""}</td><td class="n">${l.c?eur(l.c):""}</td><td class="n">${eur(s)}</td></tr>`);}

  if(ui.rep==="situacion"){const B=balanceSheet(S,t),P=balanceSheet(S,(S.year-1)+"-12-31");

    body=`<table><tr><th colspan="2">Balance de situación (modelo de pymes)</th><th class="n">${fd(t)}</th><th class="n">${fd((S.year-1)+"-12-31")}</th></tr>
    <tr class="sub"><td colspan="4">ACTIVO</td></tr>${side("A")}<tr class="tot"><td colspan="2">TOTAL ACTIVO</td><td class="n">${eur(B.activo)}</td><td class="n">${eur(P.activo)}</td></tr>
    <tr class="sub"><td colspan="4">PATRIMONIO NETO Y PASIVO</td></tr>${side("P")}<tr class="tot"><td colspan="2">TOTAL PATRIMONIO NETO Y PASIVO</td><td class="n">${eur(B.pasivo)}</td><td class="n">${eur(P.pasivo)}</td></tr></table>
    <p class="small">${B.activo===B.pasivo?`<span class="pill good">Balance cuadrado</span>`:`<span class="pill bad">Descuadre ${eur(r2(B.activo-B.pasivo))}</span>`}</p>`;}
  if(ui.rep==="pyg"){const R=pnlOfficial(S,S.year),Q=pnlOfficial(S,S.year-1);
    body=`<table><tr><th colspan="2">Cuenta de pérdidas y ganancias (modelo de pymes)</th><th class="n">${S.year}</th><th class="n">${S.year-1}</th></tr>${R.map((r,i)=>{const q=Q[i];
      if(r.title)return`<tr class="${i===R.length-1?"tot":"sub"}"><td colspan="2">${r.title}</td><td class="n">${eur(r.v)}</td><td class="n">${eur(q.v)}</td></tr>`;if(!r.v&&!q.v)return"";
      return`<tr class="eh"><td colspan="2">${r.label}</td><td class="n">${eur(r.v)}</td><td class="n">${eur(q.v)}</td></tr>`+r.accs.map(a=>{const pa=q.accs.find(z=>z.code===a.code);return`<tr><td>${a.code}</td><td>${esc(accName(a.code))}</td><td class="n">${eur(a.v)}</td><td class="n muted">${pa?eur(pa.v):""}</td></tr>`;}).join("");}).join("")}</table>

  if(ui.rep==="iva"){const sec=(kind,title)=>{let b=0,c=0;const rows=[];
      for(const i of S.invoices.filter(i=>i.kind===kind&&inYear(i)&&(!ui.lq||Math.floor((+i.date.slice(5,7)-1)/3)+1===ui.lq)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id)){const t=invTotals(i),co=contact(i.contactId);
        for(const k of Object.keys(t.byRate)){const o=t.byRate[k];b=r2(b+o.base);c=r2(c+o.vat);rows.push(`<tr><td>${fd(i.date)}</td><td>${esc(i.number)}</td><td>${esc(co.nif)}</td><td>${esc(co.name)}</td><td class="n">${eur(o.base)}</td><td class="n">${k} %</td><td class="n">${eur(o.vat)}</td><td class="n">${eur(r2(o.base+o.vat))}</td></tr>`);}}
      return`<tr class="sub"><td colspan="8">${title}</td></tr>${rows.join("")||`<tr><td colspan="8" class="muted">Sin facturas en el periodo.</td></tr>`}<tr class="tot"><td colspan="4">Total</td><td class="n">${eur(b)}</td><td></td><td class="n">${eur(c)}</td><td class="n">${eur(r2(b+c))}</td></tr>`;};
    body=`<div class="row" style="margin-bottom:10px"><label style="min-width:200px">Periodo<select id="lq"><option value="0">Todo ${S.year}</option>${[1,2,3,4].map(k=>`<option value="${k}" ${ui.lq===k?"selected":""}>${k}.º trimestre</option>`).join("")}</select></label></div>
    <table><tr><th>Fecha</th><th>Número</th><th>NIF</th><th>Nombre</th><th class="n">Base</th><th class="n">Tipo</th><th class="n">Cuota</th><th class="n">Total</th></tr>${sec("emitida","Libro registro de facturas expedidas")}${sec("recibida","Libro registro de facturas recibidas")}</table>`;}
  if(ui.rep==="analitica"){const m={};for(const i of S.invoices.filter(inYear)){const o=m[i.center||"Sin asignar"]||(m[i.center||"Sin asignar"]={a:0,b:0}),x=invTotals(i).base;if(i.kind==="emitida")o.a=r2(o.a+x);else o.b=r2(o.b+x);}
    body=`<table><tr><th>Centro de coste o proyecto</th><th class="n">Ingresos</th><th class="n">Gastos e inversiones</th><th class="n">Resultado</th></tr>${Object.keys(m).sort().map(k=>`<tr><td>${esc(k)}</td><td class="n">${eur(m[k].a)}</td><td class="n">${eur(m[k].b)}</td><td class="n"><b>${eur(r2(m[k].a-m[k].b))}</b></td></tr>`).join("")||`<tr><td colspan="4" class="muted">Sin facturas en ${S.year}.</td></tr>`}</table><p class="small muted">Se calcula con la base imponible de las facturas. Asigna el centro al crear o editar cada factura.</p>`;}
  if(ui.rep==="plan")body=`<form class="row" data-form="account" style="margin-bottom:10px"><label>Código<input id="a-code" required pattern="[0-9]{3,8}" style="width:120px"></label><label style="flex:1;min-width:200px">Nombre<input id="a-name" required></label><button class="pri" style="align-self:flex-end">Añadir cuenta</button></form>
    <table><tr><th>Código</th><th>Nombre</th></tr>${S.accounts.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td></tr>`).join("")}</table>`;
  return`<div class="head"><h1>Mayor y balances ${S.year}</h1><button data-act="tbl-csv">Exportar a Excel (.csv)</button></div><div class="tabs">${tabs.map(([k,n])=>`<button data-act="rep" data-rep="${k}" class="${ui.rep===k?"on":""}">${n}</button>`).join("")}</div><div class="card"><div class="tw">${body}</div></div>`;}

/* Bancos */
function vBancos(){const[,t]=yr();const m=balances(S,null,t,"cie:"+S.year),accs=S.accounts.filter(a=>a.code.slice(0,2)==="57");
  if(!ui.bank||!accs.some(a=>a.code===ui.bank))ui.bank=(accs.find(a=>a.code!=="570")||accs[0]).code;
  let s=0;const prev=balances(S,null,(S.year-1)+"-12-31")[ui.bank];if(prev)s=r2(prev.d-prev.c);const rows=[`<tr><td></td><td class="muted">Saldo inicial</td><td></td><td></td><td class="n">${eur(s)}</td><td></td></tr>`];let okS=s,pend=0;
  for(const e of S.entries.filter(inYear).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id))e.lines.forEach((l,k)=>{if(l.acc!==ui.bank)return;s=r2(s+l.d-l.c);if(l.ok)okS=r2(okS+l.d-l.c);else pend++;rows.push(`<tr><td>${fd(e.date)}</td><td>${esc(e.concept)}</td><td class="n">${l.d?eur(l.d):""}</td><td class="n">${l.c?eur(l.c):""}</td><td class="n">${eur(s)}</td><td class="n"><input type="checkbox" class="chk" style="width:auto" data-e="${e.id}" data-k="${k}" ${l.ok?"checked":""} aria-label="Punteado"></td></tr>`);});
  return`<div class="head"><h1>Bancos y caja</h1><div class="row"><button class="pri" data-act="mov-new">Nuevo movimiento</button><label class="btn" style="flex-direction:row;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer">Conciliar con extracto (CSV)<input id="csv-bank" type="file" accept=".csv,text/csv,text/plain" style="display:none"></label><button data-act="bank-new">Añadir cuenta bancaria</button></div></div>
  <div class="kpis">${accs.map(a=>{const b=m[a.code]||{d:0,c:0};return`<button class="kpi" style="text-align:left;${a.code===ui.bank?"border-color:var(--accent);border-width:2px":""}" data-act="bank" data-acc="${a.code}"><span>${esc(a.name)}</span><b>${eur(r2(b.d-b.c))}</b></button>`;}).join("")}</div>
  <div class="card"><h2>Movimientos de ${esc(accName(ui.bank))}</h2><div class="tw"><table><tr><th>Fecha</th><th>Concepto</th><th class="n">Entrada</th><th class="n">Salida</th><th class="n">Saldo</th><th class="n">Punteado</th></tr>${rows.reverse().join("")}</table></div><p class="small muted">Marca cada movimiento al comprobarlo con el extracto del banco. Saldo punteado: <b>${eur(okS)}</b> · sin puntear: <b>${pend}</b> movimientos. El saldo punteado debe coincidir con el del extracto. Para conciliar de golpe, sube el extracto del banco en CSV con columnas fecha; concepto; importe: se puntean solos los movimientos con el mismo importe y fecha cercana (5 días).</p></div>`;}

  else if(q===7){const r=tax190(S,y),tb=(rows,clave)=>{let b=0,t=0;return rows.map(x=>{b=r2(b+x.base);t=r2(t+x.ret);return`<tr><td>${esc(x.name||contact(x.contactId).name)}</td><td>${esc(x.nif!=null?x.nif:contact(x.contactId).nif)}</td><td>${clave}</td><td class="n">${eur(x.base)}</td><td class="n">${eur(x.ret)}</td></tr>`;}).join("")+(rows.length?`<tr class="tot"><td colspan="3">Total · ${rows.length} perceptores</td><td class="n">${eur(b)}</td><td class="n">${eur(t)}</td></tr>`:`<tr><td colspan="5" class="muted">Sin datos en ${y}.</td></tr>`);},hd=`<tr><th>Perceptor</th><th>NIF</th><th>Clave</th><th class="n">Percepciones íntegras</th><th class="n">Retenciones</th></tr>`;
    body=`<div class="card"><h2>Modelo 190 · resumen anual de retenciones</h2><div class="tw"><table>${hd}<tr class="sub"><td colspan="5">Rendimientos del trabajo · ${r.months} nóminas mensuales contabilizadas</td></tr>${tb(r.staff,"A")}<tr class="sub"><td colspan="5">Actividades profesionales · facturas recibidas con retención</td></tr>${tb(r.prof,"G")}</table></div>
    <p class="small muted">Los datos de los trabajadores se estiman multiplicando el bruto y el IRPF actuales de cada ficha por el número de nóminas mensuales contabilizadas en ${y}; si hubo cambios de sueldo o altas a mitad de año, corrígelos a mano. Se presenta en enero del año siguiente.</p></div>

  else{const v=tax303(S,y,q),i=tax130(S,y,q),r=tax111(S,y,q),al=tax115(S,y,q),[f,t]=qRange(y,q);

/* Modal y acciones */
function modal(html){const m=$("#modal");m.innerHTML=html;m.classList.add("open");const f=$("input:not([type=hidden]),select",m);if(f)f.focus();}
function closeModal(){$("#modal").classList.remove("open");$("#modal").innerHTML="";}
function fail(msg){const e=$("#f-err");if(e)e.textContent=msg;}
function done(){S.sample=S.sample&&false;save();closeModal();render();}
function ask(text,label,fn){modal(`<div class="dlg sm"><h2>Confirmar</h2><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cancelar</button><button class="pri" id="ask-ok">${esc(label)}</button></div></div>`);$("#ask-ok").onclick=()=>{fn();save();closeModal();render();};}
async function saveFile(name,text,mime){
  if(!EMBEDDED){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();return;}
  try{const d=window.claude&&await window.claude.use("downloads");if(d){await d.save({filename:name,data:text});return;}}catch(e){}
  modal(`<div class="dlg"><h2>${esc(name)}</h2><p class="small muted">Copia este contenido y guárdalo en un archivo con ese nombre.</p><textarea id="cp" rows="12" readonly>${esc(text)}</textarea><div class="row" style="justify-content:flex-end"><button id="cp-btn" class="pri">Copiar</button><button data-act="close">Cerrar</button></div></div>`);
  $("#cp-btn").onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>{$("#cp-btn").textContent="Copiado";},()=>{$("#cp").select();});}catch(e){$("#cp").select();}};}
function csv(){const rows=[["tipo","numero","fecha","vencimiento","contacto","nif","base","iva","irpf","total","cobrada_pagada"]];
  for(const i of S.invoices){const t=invTotals(i),c=contact(i.contactId);rows.push([i.kind,i.number,i.date,i.due||"",c.name,c.nif,t.base,t.vat,t.irpf,t.total,i.paid||""]);}
  return"﻿"+rows.map(r=>r.map(x=>typeof x==="number"?String(x).replace(".",","):'"'+String(x).replace(/"/g,'""')+'"').join(";")).join("\r\n");}

  else if(a==="iva-post"){if(settleVat(S,S.year,ui.q)){save();render();}else modal(`<div class="dlg sm"><h2>Nada que liquidar</h2><p>No hay IVA repercutido ni soportado pendiente hasta el final de este trimestre.</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);}

  else if(a==="asset-del")ask("Se borrará el activo y sus asientos de amortización.","Borrar",()=>{S.entries=S.entries.filter(e=>!e.src.startsWith("amo:"+id+":"));S.assets=S.assets.filter(x=>x.id!==id);});

  else if(a==="doc-conv"){const d=S.docs.find(x=>x.id===id),r=convertDoc(S,d,TODAY);if(r.type)ui.doc[d.side]=r.type;save();render();

  else if(a==="doc-del")ask("Se borrará el documento"+(S.docs.find(x=>x.id===id).type==="albaran"?" y sus movimientos de almacén.":"."),"Borrar",()=>{S.moves=S.moves.filter(m=>m.doc!==id);S.docs=S.docs.filter(x=>x.id!==id);});

    <div class="form"><label>${bd?"Unidades a fabricar":"Cantidad (negativa para salida)"}<input id="q-qty" type="number" step="any" required ${bd?'min="0.01"':""}></label><label>Fecha<input id="q-date" type="date" required value="${TODAY}"></label>${bd?"":`<label>Motivo<input id="q-ref" required value="Regularización de inventario"></label>`}</div><div class="err" id="f-err"></div><div class="row" style="justify-content:flex-end"><button type="button" data-act="close">Cancelar</button><button class="pri">Guardar</button></div></form>`);}

document.addEventListener("submit",ev=>{ev.preventDefault();const k=ev.target.dataset.form,v=id=>$("#"+id).value.trim();
  if(k==="invoice")saveInvoice();
  else if(k==="pay"){payInvoice(S,S.invoices.find(i=>i.id===+v("p-id")),v("p-date"),v("p-bank"));done();}
  else if(k==="contact"){let c=S.contacts.find(x=>x.id===+v("c-id"));if(!c){c={id:S.seq++};S.contacts.push(c);}Object.assign(c,{type:v("c-type"),name:v("c-name"),nif:v("c-nif"),email:v("c-email"),address:v("c-address")});done();}
  else if(k==="entry"){const ls=readEnt(),d=r2(ls.reduce((a,l)=>a+l.d,0)),c=r2(ls.reduce((a,l)=>a+l.c,0));if(!ls.length||d!==c)return fail("El asiento debe tener importes y cuadrar: debe = haber.");if($("#e-save").checked)S.templates.push({id:"u"+S.seq++,name:v("e-concept"),concept:v("e-concept"),lines:$$("#e-lines tr").map(tr=>({acc:$(".e-acc",tr).value,d:+$(".e-d",tr).value||0,c:+$(".e-c",tr).value||0}))});addEntry(S,v("e-date"),v("e-concept"),ls,"");done();}
  else if(k==="mov"){const amt=r2(+v("m-amount")),bk=v("m-bank"),ac=v("m-acc"),isIn=v("m-type")==="in";addEntry(S,v("m-date"),v("m-concept"),isIn?[{acc:bk,d:amt},{acc:ac,c:amt}]:[{acc:ac,d:amt},{acc:bk,c:amt}],"");ui.bank=bk;done();}
  else if(k==="doc"){const side=ev.target.dataset.side,lines=readLines();let cid=+v("f-contact");if(!lines.length)return fail("Añade al menos una línea.");
    if(!cid){const name=v("f-newname");if(!name)return fail("Elige un contacto o escribe el nombre del nuevo.");const c={id:S.seq++,type:side==="venta"?"cliente":"proveedor",name,nif:"",address:"",email:""};S.contacts.push(c);cid=c.id;}
    addDoc(S,{side,type:ui.doc[side],number:v("f-number"),date:v("f-date"),contactId:cid,lines});done();}
  else if(k==="crud"){const c=CR[ev.target.dataset.name],id=+v("k-id");let r=S[c.key].find(x=>x.id===id);if(!r){r={id:S.seq++};S[c.key].push(r);}
    for(const f of c.f){const x=v("k-"+f[0]);r[f[0]]=f[2]==="money"||f[2]==="number"||f[2]==="contact"?(+x||0):x;}done();}
  else if(k==="stock"){S.moves.push({id:S.seq++,date:v("q-date"),itemId:+v("q-id"),qty:+v("q-qty")||0,ref:v("q-ref")});done();}
  else if(k==="build"){const r=build(S,S.items.find(x=>x.id===+v("q-id")),+v("q-qty"),v("q-date"));if(!r.ok)return fail(r.missing.length?"El escandallo usa códigos que no existen o sin cantidad: "+r.missing.join(", "):"El escandallo está vacío.");done();}
  else if(k==="asset"){S.assets.push({id:S.seq++,name:v("x-name"),date:v("x-date"),cost:r2(+v("x-cost")),years:+v("x-years"),acc:v("x-acc")});done();}
  else if(k==="bank"){ui.bank=addBank(S,v("b-name")).acc;done();}
  else if(k==="account"){const code=v("a-code");if(!S.accounts.some(a=>a.code===code)){S.accounts.push({code,name:v("a-name")});S.accounts.sort((a,b)=>a.code<b.code?-1:1);}save();render();}
  else if(k==="company"){Object.assign(S.company,{name:v("s-name"),nif:v("s-nif"),address:v("s-address"),type:v("s-type")});S.year=+v("s-year");save();render();}
});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.closest("[data-form=invoice],[data-form=doc]"))updTot();
  if(t.closest("[data-form=entry]"))updEnt();
  if(t.id==="flt"){ui.filter=t.value;const p=t.selectionStart;render();const n=$("#flt");n.focus();n.setSelectionRange(p,p);}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="mayor-acc"){ui.mayor=t.value;render();}
  if(t.id==="f-item"&&t.value){const i=S.items.find(x=>x.id===+t.value);$("#f-lines").insertAdjacentHTML("beforeend",lineRow({desc:i.name,qty:1,price:t.dataset.sale==="1"?i.price:i.cost,vat:+i.vat,itemId:i.id}));t.value="";updTot();}
  if(t.id==="csv-bank"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const rows=parseBankCsv(String(fr.result)),r=reconcile(S,ui.bank,rows);save();render();
    modal(`<div class="dlg"><h2>Conciliación con el extracto</h2><p>${rows.length} líneas leídas · <b>${r.n}</b> punteadas · <b>${r.un.length}</b> sin correspondencia en contabilidad.</p>${r.un.length?`<div class="tw"><table><tr><th>Fecha</th><th>Concepto</th><th class="n">Importe</th></tr>${r.un.slice(0,30).map(x=>`<tr><td>${fd(x.date)}</td><td>${esc(x.txt)}</td><td class="n">${eur(x.amt)}</td></tr>`).join("")}</table></div><p class="small muted">Registra estos movimientos (cobro o pago de factura, o movimiento manual) y vuelve a conciliar.</p>`:""}${rows.length?"":`<p class="err">No se reconoció ninguna línea. Usa un CSV con fecha (dd/mm/aaaa), concepto e importe.</p>`}<div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);};fr.readAsText(t.files[0]);}
  if(t.classList.contains("bud")){(S.budgets[S.year]=S.budgets[S.year]||{})[t.dataset.acc]=r2(+t.value||0);save();render();}
  if(t.classList.contains("chk")){const e=S.entries.find(x=>x.id===+t.dataset.e);if(e){e.lines[+t.dataset.k].ok=t.checked;save();render();}}
  if(t.id==="co-sel"){if(t.value==="+"){const c=blank(now.getFullYear());c.company.name="Nueva empresa";addBank(c,"Cuenta corriente");newCompany(c);location.hash="ajustes";}else useCompany(t.value);}
  if(t.id==="lq"){ui.lq=+t.value;render();}
  if(t.id==="e-tpl"&&t.value){const tp=S.templates.find(x=>String(x.id)===t.value);$("#e-concept").value=tp.concept;$("#e-lines").innerHTML=tp.lines.map(entRow).join("");updEnt();}
  if(t.id==="imp"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{let d=null;try{d=JSON.parse(fr.result);}catch(e){}
    const okS=x=>x&&Array.isArray(x.entries)&&Array.isArray(x.invoices)&&Array.isArray(x.accounts)&&x.company;
    if(d&&d.companies&&Object.keys(d.companies).length&&Object.values(d.companies).every(okS))ask("El archivo contiene "+Object.keys(d.companies).length+" empresas. Se sustituirán todas las empresas actuales por las del archivo.","Sustituir todo",()=>{DB=d;if(!DB.companies[DB.current])DB.current=Object.keys(DB.companies)[0];S=DB.companies[DB.current];ensure();});
    else if(okS(d)){pend=d;modal(`<div class="dlg sm"><h2>Importar «${esc(d.company.name)}»</h2><p>${d.invoices.length} facturas y ${d.entries.length} asientos. ¿Qué quieres hacer con esta copia?</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cancelar</button><button data-act="imp-new">Añadir como empresa nueva</button><button class="pri" data-act="imp-replace">Sustituir la empresa actual</button></div></div>`);}
    else modal(`<div class="dlg sm"><h2>No se pudo importar</h2><p>El archivo no es una copia de Cuaderna. Elige un .json exportado desde Ajustes.</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);t.value="";};fr.readAsText(t.files[0]);}
  if(t.id==="imp-inv"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const r=importInvoices(S,String(fr.result));save();render();
    modal(`<div class="dlg sm"><h2>Importación de facturas</h2><p><b>${r.n}</b> facturas importadas y contabilizadas. ${r.skip?`<b>${r.skip}</b> líneas omitidas por estar repetidas o incompletas.`:""}</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);};fr.readAsText(t.files[0]);}
});
document.addEventListener("mousemove",ev=>{const tip=$("#tip");if(!tip)return;const h=ev.target.closest&&ev.target.closest(".hit");if(!h){tip.style.display="none";return;}
  const box=tip.parentElement.getBoundingClientRect();tip.textContent=h.dataset.tip;tip.style.display="block";
  tip.style.left=Math.max(0,Math.min(ev.clientX-box.left+12,box.width-tip.offsetWidth))+"px";tip.style.top=Math.max(0,ev.clientY-box.top-34)+"px";});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeModal();});
window.addEventListener("hashchange",()=>{ui.filter="";closeModal();render();});
init();
</script>
</body>
</html>
