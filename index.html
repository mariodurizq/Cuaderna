<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderna Contabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed ledger-style sidebar + one working column; tables carry the page, numbers right-aligned in tabular figures. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#15201f; --muted:#5d6b69; --line:#d9e0de;
  --accent:#0d5f66; --accent-ink:#ffffff; --accent-soft:#e1efef;
  --good:#1c7a3e; --warn:#9a5d00; --bad:#b3302f;
  --good-soft:#e3f3e8; --warn-soft:#fbefd9; --bad-soft:#fae5e4;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e3e8e6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#171f1e; --ink:#e8eeec; --muted:#9aa8a5; --line:#2a3533;
    --accent:#5cc4cb; --accent-ink:#06282b; --accent-soft:#16383b;
    --good:#5fce85; --warn:#f0b04a; --bad:#f08a86;
    --good-soft:#173524; --warn-soft:#3a2c10; --bad-soft:#3d1d1c;
    --s1:#3987e5; --s2:#d95926; --grid:#27312f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171f1e; --ink:#e8eeec; --muted:#9aa8a5; --line:#2a3533;
  --accent:#5cc4cb; --accent-ink:#06282b; --accent-soft:#16383b;
  --good:#5fce85; --warn:#f0b04a; --bad:#f08a86;
  --good-soft:#173524; --warn-soft:#3a2c10; --bad-soft:#3d1d1c;
  --s1:#3987e5; --s2:#d95926; --grid:#27312f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
aside{overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.brand{font:700 22px/1 var(--display);padding:0 8px;letter-spacing:-.01em}
.brand small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:6px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px}
nav a{padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--accent-soft)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:18px}
h1{font:700 26px/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:600 17px/1.2 var(--display);margin:0;text-wrap:balance}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font:600 21px/1.3 var(--display)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
tr.sub td{background:var(--bg);font-weight:600}
tr.eh td{background:var(--bg);font-weight:500}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--accent-soft);color:var(--accent)}
button,.btn{font:500 14px var(--body);padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}
button.link{white-space:nowrap;border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:400 14px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:13.5px;max-width:75ch}
.pk{position:relative;min-width:0}
.pk-list{position:fixed;z-index:30;max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pk-it{padding:7px 10px;cursor:pointer;font-size:14px;display:flex;gap:8px;justify-content:space-between}
.pk-it small{color:var(--muted);white-space:nowrap}
.pk-it.on,.pk-it:hover{background:var(--accent-soft)}
.pk-more{padding:6px 10px;font-size:12px;color:var(--muted)}
#ed{border-color:var(--accent)}
.flash{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-size:14px;font-weight:600}
#modal{position:fixed;inset:0;background:rgba(10,20,20,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:10}
#modal.open{display:flex}
.dlg{background:var(--surface);border-radius:10px;padding:20px;width:min(860px,100%);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.dlg.sm{width:min(460px,100%)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--body)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
.inv{background:#fff;color:#111;padding:28px;border:1px solid var(--line);border-radius:6px}
.inv table th,.inv table td{border-color:#ddd;color:#111}
.inv .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.inv h3{font:700 22px var(--display);margin:0 0 6px}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  nav{flex-direction:row;overflow-x:auto} nav a{white-space:nowrap} nav .sep{display:none}
  main{padding:16px}
}
@media print{
  body *{visibility:hidden} .inv,.inv *{visibility:visible}
  #modal{position:static;background:none;padding:0;display:block} .dlg{border:0;padding:0}
  .inv{border:0;position:absolute;left:0;top:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Cuaderna<small id="co-name"></small></div>
    <select id="co-sel" aria-label="Empresa" style="margin:0 8px;width:calc(100% - 16px)"></select>
    <nav id="nav"></nav>
    <button id="theme" data-act="theme" style="margin:0 8px"></button>
  </aside>
  <main id="main"></main>
</div>
<div id="modal"></div>
<script>
/*CORE-START*/
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const pad=(n,l)=>String(n).padStart(l,'0');
const PGC=[["100","Capital social"],["102","Capital"],["112","Reserva legal"],["113","Reservas voluntarias"],["120","Remanente"],["121","Resultados negativos de ejercicios anteriores"],["129","Resultado del ejercicio"],["170","Deudas a largo plazo con entidades de crédito"],
["213","Maquinaria"],["216","Mobiliario"],["217","Equipos para procesos de información"],["218","Elementos de transporte"],["281","Amortización acumulada del inmovilizado material"],
["300","Mercaderías"],["400","Proveedores"],["410","Acreedores por prestaciones de servicios"],["430","Clientes"],["465","Remuneraciones pendientes de pago"],["4700","HP, deudora por IVA"],
["472","HP, IVA soportado"],["473","HP, retenciones y pagos a cuenta"],["4750","HP, acreedora por IVA"],["4751","HP, acreedora por retenciones practicadas"],["4752","HP, acreedora por impuesto sobre sociedades"],
["476","Organismos de la Seguridad Social, acreedores"],["477","HP, IVA repercutido"],["520","Deudas a corto plazo con entidades de crédito"],["550","Titular de la explotación"],
["570","Caja, euros"],["572","Bancos e instituciones de crédito c/c vista, euros"],["600","Compras de mercaderías"],["621","Arrendamientos y cánones"],["622","Reparaciones y conservación"],["623","Servicios de profesionales independientes"],
["624","Transportes"],["625","Primas de seguros"],["626","Servicios bancarios"],["627","Publicidad y relaciones públicas"],["628","Suministros"],["629","Otros servicios"],
["630","Impuesto sobre beneficios"],["631","Otros tributos"],["640","Sueldos y salarios"],["642","Seguridad Social a cargo de la empresa"],["662","Intereses de deudas"],["681","Amortización del inmovilizado material"],
["700","Ventas de mercaderías"],["705","Prestaciones de servicios"],["759","Ingresos por servicios diversos"],["769","Otros ingresos financieros"]];
const PGCV=3;let DIG=6;
function x6(c){c=String(c);if(c.length>=DIG)return c;if(c.length===5&&c.startsWith("572"))return"572"+pad(+c.slice(3),DIG-3);return c.padEnd(DIG,"0");}
function remapAccounts(S,map){const mp=c=>c==null?c:(map[c]!==undefined?map[c]:c),keep={};
  for(const a of S.accounts){const n=mp(a.code);if(!keep[n]||a.code===n)keep[n]={code:n,name:keep[n]&&a.code!==n?keep[n].name:a.name};}
  S.accounts=Object.values(keep).sort((a,b)=>a.code<b.code?-1:1);
  for(const e of S.entries)for(const l of e.lines)l.acc=mp(l.acc);for(const i of S.invoices){i.account=mp(i.account);if(i.bank)i.bank=mp(i.bank);}
  for(const a of S.assets||[])a.acc=mp(a.acc);for(const b of S.banks)b.acc=mp(b.acc);for(const c of S.contacts)if(c.acc)c.acc=mp(c.acc);
  for(const t of S.templates||[])for(const l of t.lines)l.acc=mp(l.acc);
  for(const y in S.budgets||{}){const o={};for(const k in S.budgets[y]){const n=mp(k);o[n]=r2((o[n]||0)+S.budgets[y][k]);}S.budgets[y]=o;}}
function renameAccount(S,from,to){if(from===to)return{ok:true};if(!/^\d+$/.test(to)||to.length<S.digits)return{ok:false,msg:"El número debe tener "+S.digits+" cifras o más."};
  const merge=S.accounts.some(a=>a.code===to);remapAccounts(S,{[from]:to});return{ok:true,merge};}
function accRoot(code){let r=code.slice(0,3);for(const[c]of PGC)if(c.length>r.length&&code.startsWith(c))r=c;return r;}
function digitsPlan(S,n){const map={},bad=[],seen={};for(const a of S.accounts){const r=accRoot(a.code),rest=a.code.slice(r.length),len=Math.max(1,rest.length+n-S.digits);let nr;
    if(len>=rest.length)nr=rest.padStart(len,"0");else{const cutp=rest.slice(0,rest.length-len);nr=/^0*$/.test(cutp)?rest.slice(rest.length-len):null;}
    const nc=nr==null?null:r+nr;if(nc==null||seen[nc])bad.push(a.code);else{seen[nc]=1;map[a.code]=nc;}}return{map,bad};}
function setDigits(S,n){const p=digitsPlan(S,n);if(p.bad.length)return{ok:false,bad:p.bad};remapAccounts(S,p.map);S.digits=n;DIG=n;return{ok:true};}
function addAcc(S,code,name){if(!S.accounts.some(a=>a.code===code)){S.accounts.push({code,name});S.accounts.sort((a,b)=>a.code<b.code?-1:1);}return code;}
function contactAcc(S,id,kind){const c=S.contacts.find(x=>x.id===id);if(!c)return x6(kind==="recibida"?"400":"430");
  if(!c.acc||!S.accounts.some(a=>a.code===c.acc)){const root=c.type==="proveedor"?"400":"430";let n=1;while(S.accounts.some(a=>a.code===root+pad(n,DIG-3)))n++;c.acc=addAcc(S,root+pad(n,DIG-3),c.name);}return c.acc;}
function vatAcc(S,root,rate){return addAcc(S,root+pad(String(rate).replace(".",""),DIG-3),"HP, IVA "+(root==="472"?"soportado":"repercutido")+" "+String(rate).replace(".",",")+" %");}
function migrate6(S){DIG=6;const map={},used=new Set();for(const a of S.accounts){let t=x6(a.code);while(used.has(t))t=String(+t+1);used.add(t);map[a.code]=t;a.code=t;}
  const mp=c=>c==null?c:(map[c]||x6(c));
  for(const e of S.entries)for(const l of e.lines)l.acc=mp(l.acc);for(const i of S.invoices){i.account=mp(i.account);if(i.bank)i.bank=mp(i.bank);}
  for(const a of S.assets||[])a.acc=mp(a.acc);for(const b of S.banks)b.acc=mp(b.acc);for(const t of S.templates||[])for(const l of t.lines)l.acc=mp(l.acc);
  for(const y in S.budgets||{}){const o={};for(const k in S.budgets[y])o[mp(k)]=S.budgets[y][k];S.budgets[y]=o;}
  S.accounts.sort((a,b)=>a.code<b.code?-1:1);S.digits=6;
  const okPay={};for(const e of S.entries)if(e.src.startsWith("pay:")&&e.lines.some(l=>l.ok))okPay[e.src]=true;
  const ivas=S.entries.filter(e=>e.src.startsWith("iva:")).map(e=>e.src.split(":").slice(1).map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const closed=[...new Set(S.entries.filter(e=>/^(reg|cie):/.test(e.src)).map(e=>+e.src.slice(4)))].sort();
  S.entries=S.entries.filter(e=>!/^(iva|reg|cie|ape):/.test(e.src));const fb=(S.banks[0]||{}).acc||x6("570");
  for(const i of S.invoices){postInvoice(S,i);if(i.paid){payInvoice(S,i,i.paid,i.bank||fb);if(okPay["pay:"+i.id])for(const l of S.entries[S.entries.length-1].lines)if(l.acc.startsWith("57"))l.ok=true;}}
  for(const[y,q]of ivas)settleVat(S,y,q);for(const y of closed)closeYear(S,y);}
const NIFL="TRWAGMYFPDXBNJZSQVHLCKE";
function nifNorm(n){return String(n||"").toUpperCase().replace(/[\s.\-\/]/g,"");}
function nifCheck(n){n=nifNorm(n);if(!n)return"empty";let m=/^(\d{8})([A-Z])$/.exec(n);if(m)return NIFL[+m[1]%23]===m[2]?"ok":"bad";
  m=/^([XYZ])(\d{7})([A-Z])$/.exec(n);if(m)return NIFL[+("XYZ".indexOf(m[1])+m[2])%23]===m[3]?"ok":"bad";
  m=/^([KLM])(\d{7})([A-Z])$/.exec(n);if(m)return NIFL[+m[2]%23]===m[3]?"ok":"bad";
  m=/^([ABCDEFGHJNPQRSUVW])(\d{7})([0-9A-J])$/.exec(n);if(m){let a=0,b=0;for(let i=0;i<7;i++){const x=+m[2][i];if(i%2===0){const y=x*2;b+=Math.floor(y/10)+y%10;}else a+=x;}
    const c=(10-(a+b)%10)%10,ch="JABCDEFGHI"[c];if("PQRSNW".includes(m[1]))return m[3]===ch?"ok":"bad";if("ABEH".includes(m[1]))return m[3]===String(c)?"ok":"bad";return m[3]===String(c)||m[3]===ch?"ok":"bad";}
  return"bad";}
function mkCif(L,d){let a=0,b=0;for(let i=0;i<7;i++){const x=+d[i];if(i%2===0){const y=x*2;b+=Math.floor(y/10)+y%10;}else a+=x;}const c=(10-(a+b)%10)%10;return L+d+("PQRSNW".includes(L)?"JABCDEFGHI"[c]:String(c));}
function mkDni(d){return d+NIFL[+d%23];}
function blank(year){return{v:1,seq:1,year,sample:false,company:{name:"Mi empresa",nif:"",address:"",type:"autonomo"},
  digits:DIG,pgcv:PGCV,accounts:PGC.map(([code,name])=>({code:x6(code),name})),contacts:[],invoices:[],entries:[],banks:[],assets:[],budgets:{},items:[],moves:[],docs:[],contracts:[],opps:[],projects:[],staff:[],templates:defTemplates()};}
function defTemplates(){const T=(name,accs)=>({id:"t"+name.length+accs.length+accs[0],name,concept:name,lines:accs.map(a=>({acc:x6(a),d:0,c:0}))});
  return[T("Nómina del mes (devengo)",["640","642","4751","476","465"]),T("Pago de nóminas",["465","57201"]),T("Pago de seguros sociales",["476","57201"]),T("Pago de la liquidación de IVA",["4750","57201"]),
    T("Pago de retenciones a Hacienda",["4751","57201"]),T("Cuota de préstamo",["520","662","57201"]),T("Comisión bancaria",["626","57201"]),T("Impuesto sobre Sociedades (devengo)",["630","4752"]),T("Aplicación del resultado",["129","112","113"])];}
function invTotals(inv){let base=0,vat=0;const byRate={};
  for(const l of inv.lines){const b=r2(l.qty*l.price),v=r2(b*l.vat/100);base+=b;vat+=v;
    const k=byRate[l.vat]||(byRate[l.vat]={base:0,vat:0});k.base=r2(k.base+b);k.vat=r2(k.vat+v);}
  base=r2(base);vat=r2(vat);const irpf=r2(base*(inv.irpf||0)/100);
  return{base,vat,irpf,total:r2(base+vat-irpf),byRate};}
function addEntry(S,date,concept,lines,src){
  const e={id:S.seq++,date,concept,src:src||"",lines:lines.map(l=>({acc:l.acc,d:r2(l.d||0),c:r2(l.c||0),contact:l.contact||null})).filter(l=>l.d||l.c)};
  S.entries.push(e);return e;}
function dropEntries(S,src){S.entries=S.entries.filter(e=>e.src!==src);}
function postInvoice(S,inv){const t=invTotals(inv);dropEntries(S,"inv:"+inv.id);
  const c=S.contacts.find(x=>x.id===inv.contactId),who=c?c.name:"",ca=contactAcc(S,inv.contactId,inv.kind),rates=Object.keys(t.byRate).filter(k=>t.byRate[k].vat).sort((a,b)=>a-b);
  if(inv.kind==="emitida")addEntry(S,inv.date,"Factura "+inv.number+" "+who,[{acc:ca,d:t.total,contact:inv.contactId},{acc:x6("473"),d:t.irpf},{acc:inv.account,c:t.base}].concat(rates.map(k=>({acc:vatAcc(S,"477",k),c:t.byRate[k].vat}))),"inv:"+inv.id);
  else addEntry(S,inv.date,"Factura recibida "+inv.number+" "+who,[{acc:inv.account,d:t.base}].concat(rates.map(k=>({acc:vatAcc(S,"472",k),d:t.byRate[k].vat})),[{acc:ca,c:t.total,contact:inv.contactId},{acc:x6("4751"),c:t.irpf}]),"inv:"+inv.id);}
function payInvoice(S,inv,date,bankAcc){const t=invTotals(inv),ca=contactAcc(S,inv.contactId,inv.kind);dropEntries(S,"pay:"+inv.id);
  if(inv.kind==="emitida")addEntry(S,date,"Cobro factura "+inv.number,[{acc:bankAcc,d:t.total},{acc:ca,c:t.total,contact:inv.contactId}],"pay:"+inv.id);
  else addEntry(S,date,"Pago factura "+inv.number,[{acc:ca,d:t.total,contact:inv.contactId},{acc:bankAcc,c:t.total}],"pay:"+inv.id);
  inv.paid=date;inv.bank=bankAcc;}
function unpayInvoice(S,inv){dropEntries(S,"pay:"+inv.id);inv.paid=null;inv.bank=null;}

function chart(ms){const W=640,H=240,L=46,B=24,T=10,max=Math.max(1,...ms.map(x=>Math.max(x.a,x.b)));

  const y=v=>T+(H-T-B)*(1-v/top),gw=(W-L)/12,bw=Math.min(14,gw/2-5);
  const bar=(x,v,c)=>{if(v<=0)return"";const h=H-B-y(v),r=Math.min(3,h);return`<path d="M${x},${H-B}v${-(h-r)}q0,${-r} ${r},${-r}h${bw-2*r}q${r},0 ${r},${r}v${h-r}z" fill="${c}"/>`;};
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">
  ${ticks.map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("es-ES")+" k":v}</text>`).join("")}

function pkAccounts(src){const pre=src.includes(":")?src.split(":")[1].split(","):null;return S.accounts.filter(a=>!pre||pre.some(p=>a.code.startsWith(p)));}
function pkSearch(src,q){const qn=norm(q).trim(),out=[];
  if(src==="cliente"||src==="proveedor"){for(const c of S.contacts){if(c.type!==src)continue;const n=norm(c.name),nf=norm(c.nif),ac=c.acc||"";let sc=-1;
      if(!qn)sc=1;else if(n.startsWith(qn))sc=0;else if(n.split(/\s+/).some(w=>w.startsWith(qn))||nf.startsWith(qn)||ac.startsWith(qn))sc=1;else if(n.includes(qn))sc=2;
      if(sc>=0)out.push({v:String(c.id),l:c.name,s:[c.nif,ac].filter(Boolean).join(" · "),sc});}}
  else for(const a of pkAccounts(src)){const n=norm(a.name);let sc=-1;if(!qn)sc=1;else if(a.code.startsWith(qn))sc=0;else if(n.startsWith(qn))sc=0;else if(n.split(/\s+/).some(w=>w.startsWith(qn)))sc=1;else if(n.includes(qn))sc=2;
      if(sc>=0)out.push({v:a.code,l:a.code+" · "+a.name,s:"",sc});}
  return out.sort((a,b)=>a.sc-b.sc||(a.l<b.l?-1:1));}

function pkOpen(inp){const box=inp.closest(".pk"),src=box.dataset.src,list=$(".pk-list",box),q=inp.value,res=pkSearch(src,q),max=60;pkCur=inp;

function pkBlur(inp){const box=inp.closest(".pk");if(!box||box.dataset.free)return;const hid=$(".pk-val",box),src=box.dataset.src,ct=src==="cliente"||src==="proveedor",q=inp.value.trim();

 contratos:{key:"contracts",title:"Contratos y facturación periódica",one:"contrato",f:[["concept","Concepto","text"],["contactId","Cliente","contact","cliente"],["amount","Importe por periodo, sin IVA","money"],["vat","IVA %","select",[21,10,4,0]],["every","Periodicidad","select",[["1","Mensual"],["3","Trimestral"],["12","Anual"]]],["next","Próxima factura","date"]]},
 crm:{key:"opps",title:"Oportunidades de venta",one:"oportunidad",f:[["title","Oportunidad","text"],["contactId","Cliente","contact","cliente"],["amount","Importe estimado","money"],["stage","Fase","select",["Nueva","Contactada","Propuesta enviada","Ganada","Perdida"]],["next","Próxima acción","date"],["notes","Notas","text"]]},
 proyectos:{key:"projects",title:"Proyectos",one:"proyecto",f:[["name","Nombre (el mismo que el centro de coste de las facturas)","text"],["contactId","Cliente","contact","cliente"],["budget","Presupuesto de ingresos","money"],["status","Estado","select",["En curso","En pausa","Terminado"]]]},
 personal:{key:"staff",title:"Personal y nóminas",one:"empleado",f:[["name","Nombre","text"],["nif","NIF","text"],["role","Puesto","text"],["gross","Bruto mensual","money"],["irpf","IRPF %","number"],["ssw","Seg. Social trabajador %","number"],["sse","Seg. Social empresa %","number"]]}};
function cell(f,v){const t=f[2];if(t==="money")return eur(+v);if(t==="date")return fd(v);if(t==="contact")return esc(contact(+v).name);
  if(t==="select"&&Array.isArray(f[3][0]))return esc((f[3].find(o=>o[0]==v)||["",v])[1]);return esc(v==null?"":v);}
function crudView(name,o){o=o||{};const c=CR[name],fs=c.f.filter(f=>!f[4]),nu=f=>f[2]==="money"||f[2]==="number"?"n":"";
  return`<div class="head"><h1>${c.title}</h1><div class="row">${o.top||""}<button class="pri" data-act="crud-new" data-name="${name}">Nuevo ${c.one}</button></div></div>${o.before||""}
  <div class="card"><div class="tw"><table><tr>${fs.map(f=>`<th class="${nu(f)}">${f[1].split(" (")[0].split(",")[0]}</th>`).join("")}${(o.head||[]).map(h=>`<th class="n">${h}</th>`).join("")}<th></th></tr>
  ${S[c.key].map(r=>`<tr>${fs.map(f=>`<td class="${nu(f)}">${cell(f,r[f[0]])}</td>`).join("")}${(o.cols?o.cols(r):[]).map(x=>`<td class="n">${x}</td>`).join("")}<td class="n">${o.acts?o.acts(r):""}<button class="link" data-act="crud-edit" data-name="${name}" data-id="${r.id}">Editar</button><button class="link" data-act="crud-del" data-name="${name}" data-id="${r.id}">Borrar</button></td></tr>`).join("")||`<tr><td colspan="${fs.length+(o.head||[]).length+1}" class="muted">Aún no hay datos.</td></tr>`}</table></div>${o.note?`<p class="small muted">${o.note}</p>`:""}</div>${o.after||""}`;}
function crudForm(name,id){const c=CR[name],r=S[c.key].find(x=>x.id===id)||{};
  modal(`<form class="dlg" data-form="crud" data-name="${name}"><h2>${id?"Editar":"Nuevo"} ${c.one}</h2><input type="hidden" id="k-id" value="${id||0}"><div class="form">${c.f.map((f,n)=>{const v=r[f[0]]==null?"":r[f[0]],t=f[2];let inp;
    if(t==="select")inp=`<select id="k-${f[0]}">${f[3].map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${val}" ${val==v?"selected":""}>${lab}</option>`;}).join("")}</select>`;
    else if(t==="contact")inp=`<select id="k-${f[0]}">${S.contacts.filter(x=>x.type===f[3]).map(x=>`<option value="${x.id}" ${x.id===v?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
    else inp=`<input id="k-${f[0]}" type="${t==="money"||t==="number"?"number":t}" step="any" ${n===0?"required":""} value="${esc(v)}">`;
    return`<label>${f[1]}${inp}</label>`;}).join("")}</div><div class="row" style="justify-content:flex-end"><button type="button" data-act="close">Cancelar</button><button class="pri">Guardar</button></div></form>`);}
function vArticulos(){const st=stockMap(S);let val=0,low=0;for(const i of S.items){const q=st[i.id]||0;val=r2(val+q*(i.cost||0));if(q<(i.min||0))low++;}
  const name=id=>(S.items.find(i=>i.id===id)||{name:"(borrado)"}).name;
  return crudView("articulos",{before:`<div class="kpis"><div class="kpi"><span>Valor del inventario a coste</span><b>${eur(val)}</b></div><div class="kpi"><span>Artículos bajo mínimo</span><b>${low}</b></div><div class="kpi"><span>Referencias</span><b>${S.items.length}</b></div></div>`,
   head:["Stock","Valor"],cols:i=>{const q=st[i.id]||0;return[`<b>${q.toLocaleString("es-ES")}</b> ${q<(i.min||0)?`<span class="pill bad">Bajo mínimo</span>`:""}`,eur(r2(q*(i.cost||0)))];},
   acts:i=>`<button class="link" data-act="stock-adj" data-id="${i.id}">Ajustar stock</button>${i.bom?`<button class="link" data-act="build" data-id="${i.id}">Fabricar</button>`:""}`,
   note:"El stock entra con los albaranes de compra y sale con los de venta. Un artículo con escandallo se puede fabricar: consume sus componentes y suma stock del producto.",
   after:`<div class="card"><h2>Últimos movimientos de almacén</h2><div class="tw"><table><tr><th>Fecha</th><th>Artículo</th><th>Motivo</th><th class="n">Cantidad</th></tr>${S.moves.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,15).map(m=>`<tr><td>${fd(m.date)}</td><td>${esc(name(m.itemId))}</td><td>${esc(m.ref)}</td><td class="n">${m.qty>0?"+":""}${m.qty.toLocaleString("es-ES")}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Sin movimientos.</td></tr>`}</table></div></div>`});}
function vContratos(){const due=S.contracts.filter(c=>c.next&&c.next<=TODAY).length;
  return crudView("contratos",{top:`<button data-act="contracts-run">Generar facturas pendientes (${due})</button>`,note:"Cada contrato genera una factura emitida en su fecha y avanza a la siguiente según la periodicidad."});}
function vCRM(){const st=CR.crm.f[3][3];return crudView("crm",{before:`<div class="kpis">${st.map(x=>{const l=S.opps.filter(o=>o.stage===x);return`<div class="kpi"><span>${x} (${l.length})</span><b>${eur(l.reduce((a,o)=>r2(a+(+o.amount||0)),0))}</b></div>`;}).join("")}</div>`});}
function vProyectos(){const t=p=>{let a=0,b=0;for(const i of S.invoices)if(i.center===p.name){const x=invTotals(i).base;if(i.kind==="emitida")a=r2(a+x);else b=r2(b+x);}return[a,b];};
  return crudView("proyectos",{head:["Ingresos","Gastos","Margen","Sobre presupuesto"],cols:p=>{const[a,b]=t(p);return[eur(a),eur(b),`<b>${eur(r2(a-b))}</b>`,p.budget?Math.round(a/p.budget*100)+" %":""];},note:"Los importes salen de las facturas cuyo centro de coste coincide con el nombre del proyecto."});}
function vPersonal(){const done=m=>S.entries.some(e=>e.src==="nom:"+S.year+":"+m);
  return crudView("personal",{top:`<select id="pay-month" style="width:auto" aria-label="Mes">${MES.map((n,k)=>`<option value="${k+1}" ${k===now.getMonth()?"selected":""}>${n} ${S.year}${done(k+1)?" ✓":""}</option>`).join("")}</select><button data-act="payroll-post">Contabilizar nóminas del mes</button>`,
   head:["Neto estimado","Coste empresa"],cols:e=>[eur(r2(e.gross-r2(e.gross*e.irpf/100)-r2(e.gross*e.ssw/100))),eur(r2(e.gross+r2(e.gross*e.sse/100)))],
   note:"Estimación contable: reparte el bruto con los porcentajes que indiques y crea el asiento (640, 642 a 4751, 476 y 465). No calcula nóminas legales, bases de cotización ni pagas extra, y no genera recibos de salarios ni ficheros para la Seguridad Social."});}

/* Cartera */
function vCartera(){const open=S.invoices.filter(i=>!i.paid).sort((a,b)=>(a.due||a.date)<(b.due||b.date)?-1:1);
  const bk=i=>{const d=i.due||i.date;if(d<TODAY)return 0;const n=(new Date(d)-new Date(TODAY))/864e5;return n<=30?1:n<=60?2:3;};
  const names=["Vencido","Hasta 30 días","31 a 60 días","Más de 60 días"],tot={emitida:[0,0,0,0],recibida:[0,0,0,0]};
  for(const i of open)tot[i.kind][bk(i)]=r2(tot[i.kind][bk(i)]+invTotals(i).total);
  const sum=a=>r2(a.reduce((x,y)=>x+y,0)),line=(n,a)=>`<tr><td>${n}</td>${a.map(v=>`<td class="n">${eur(v)}</td>`).join("")}<td class="n"><b>${eur(sum(a))}</b></td></tr>`;
  return`<div class="head"><h1>Cartera de cobros y pagos</h1><button data-act="tbl-csv">Exportar a Excel (.csv)</button></div>
  <div class="card"><h2>Previsión por vencimiento</h2><div class="tw"><table><tr><th></th>${names.map(n=>`<th class="n">${n}</th>`).join("")}<th class="n">Total</th></tr>${line("A cobrar",tot.emitida)+line("A pagar",tot.recibida)}
  <tr class="tot"><td>Neto previsto</td>${tot.emitida.map((v,k)=>`<td class="n">${eur(r2(v-tot.recibida[k]))}</td>`).join("")}<td class="n">${eur(r2(sum(tot.emitida)-sum(tot.recibida)))}</td></tr></table></div></div>
  <div class="card"><h2>Efectos pendientes</h2><div class="tw"><table><tr><th>Vence</th><th>Factura</th><th>Contacto</th><th>Tipo</th><th class="n">Importe</th><th>Estado</th><th></th></tr>
  ${open.map(i=>`<tr><td>${fd(i.due||i.date)}</td><td><button class="link" data-act="inv-view" data-id="${i.id}">${esc(i.number)}</button></td><td>${esc(contact(i.contactId).name)}</td><td><span class="pill ${i.kind==="emitida"?"neu":"warn"}">${i.kind==="emitida"?"Cobro":"Pago"}</span></td><td class="n">${eur(invTotals(i).total)}</td><td>${status(i)}</td><td class="n"><button class="link" data-act="inv-pay" data-id="${i.id}">${i.kind==="emitida"?"Cobrar":"Pagar"}</button></td></tr>`).join("")||`<tr><td colspan="7" class="muted">No hay cobros ni pagos pendientes.</td></tr>`}</table></div></div>`;}

/* Activos fijos */
function vActivos(){const y=S.year;let tc=0,ta=0;
  const rows=S.assets.map(a=>{const ac=assetPosted(S,a),d=assetDep(a,y),ok=S.entries.some(e=>e.src==="amo:"+a.id+":"+y);tc=r2(tc+a.cost);ta=r2(ta+ac);
    return`<tr><td><b>${esc(a.name)}</b></td><td>${a.acc} ${esc(accName(a.acc))}</td><td>${fd(a.date)}</td><td class="n">${eur(a.cost)}</td><td class="n">${a.years} años</td><td class="n">${eur(d)} ${d?(ok?`<span class="pill good">Contabilizada</span>`:`<span class="pill warn">Pendiente</span>`):""}</td><td class="n">${eur(ac)}</td><td class="n"><b>${eur(r2(a.cost-ac))}</b></td><td class="n"><button class="link" data-act="asset-del" data-id="${a.id}">Borrar</button></td></tr>`;}).join("");
  return`<div class="head"><h1>Activos fijos</h1><div class="row"><button data-act="dep-post">Contabilizar amortización ${y}</button><button class="pri" data-act="asset-new">Nuevo activo</button></div></div>
  <div class="card"><div class="tw"><table><tr><th>Activo</th><th>Cuenta</th><th>Alta</th><th class="n">Coste</th><th class="n">Vida útil</th><th class="n">Cuota ${y}</th><th class="n">Amortizado</th><th class="n">Valor neto</th><th></th></tr>${rows||`<tr><td colspan="9" class="muted">Aún no hay activos.</td></tr>`}
  ${S.assets.length?`<tr class="tot"><td colspan="3">Total</td><td class="n">${eur(tc)}</td><td colspan="2"></td><td class="n">${eur(ta)}</td><td class="n">${eur(r2(tc-ta))}</td><td></td></tr>`:""}</table></div>
  <p class="small muted">Amortización lineal, prorrateada por días el año de alta, con asiento 681 a 281 a 31 de diciembre. Dar de alta un activo no contabiliza su compra: regístrala como factura recibida con una cuenta del grupo 2.</p></div>`;}

/* Cierre y apertura */
function vCierre(){const ys=[...new Set(S.entries.filter(e=>!e.src.startsWith("ape:")).map(e=>+e.date.slice(0,4)))].sort((a,b)=>a-b);
  const rows=ys.map(y=>{const st=closeState(S,y),res=pnl(S,y+"-01-01",y+"-12-31").result,ape=S.entries.find(e=>e.src==="ape:"+y),tot=ape?r2(ape.lines.reduce((a,l)=>a+l.d,0)):0;
    const pill=st.status==="abierto"?`<span class="pill neu">Abierto</span>`:st.status==="definitivo"?`<span class="pill good">Cerrado definitivamente</span>`:`<span class="pill warn">Cierre provisional</span>`;
    const acts=st.status==="abierto"?`<button class="pri" data-act="cl-close" data-y="${y}">Cerrar ${y} y abrir ${y+1}</button>`
      :st.status==="provisional"?`<button ${st.stale?'class="pri"':""} data-act="cl-update" data-y="${y}">Actualizar cierre y apertura</button><button data-act="cl-def" data-y="${y}">Cierre definitivo</button><button class="link" data-act="cl-undo" data-y="${y}">Deshacer</button>`
      :`<button data-act="cl-reopen" data-y="${y}">Reabrir ${y}</button>`;
    return`<tr><td><b>${y}</b></td><td class="n">${eur(res)}</td><td>${pill}${st.stale?` <span class="pill bad">Desactualizado · ${st.diff} ${st.diff===1?"cuenta":"cuentas"}</span>`:""}</td><td>${ape?`Apertura de ${y+1}: ${ape.lines.length} cuentas, ${eur(tot)}`:"—"}</td><td class="n"><div class="row" style="justify-content:flex-end">${acts}</div></td></tr>`
      +(ape?`<tr><td></td><td colspan="4"><details><summary class="small muted">Ver el asiento de apertura de ${y+1}</summary><div class="tw"><table class="small"><tr><th>Cuenta</th><th>Nombre</th><th class="n">Debe</th><th class="n">Haber</th></tr>${ape.lines.map(l=>`<tr><td>${l.acc}</td><td>${esc(accName(l.acc))}</td><td class="n">${l.d?eur(l.d):""}</td><td class="n">${l.c?eur(l.c):""}</td></tr>`).join("")}</table></div></details></td></tr>`:"");}).join("");
  return`<div class="head"><h1>Cierre y apertura</h1></div>
  <div class="note" style="max-width:none">Cada ejercicio se cierra a 31 de diciembre con dos asientos (regularización de ingresos y gastos contra la 129, y cierre de todas las cuentas) y el siguiente se abre el 1 de enero con los saldos pendientes. Lo habitual:
  <ol style="margin:6px 0 0;padding-left:18px"><li><b>En enero</b>, cuando empieza el movimiento del año nuevo: <b>Cerrar y abrir</b>. Queda como cierre provisional, con los saldos que haya en ese momento.</li>
  <li><b>Durante los meses siguientes</b>, si se registran facturas, amortizaciones o ajustes del año anterior, el cierre queda <b>desactualizado</b> y el programa lo avisa. <b>Actualizar cierre y apertura</b> rehace los tres asientos con los saldos definitivos.</li>
  <li><b>Al terminar</b> (cuentas anuales, impuesto de sociedades): <b>Cierre definitivo</b>. Bloquea los cambios en ese año. Se puede reabrir si hace falta.</li></ol></div>
  <div class="card"><div class="tw"><table><tr><th>Ejercicio</th><th class="n">Resultado</th><th>Estado</th><th>Apertura del año siguiente</th><th></th></tr>${rows||`<tr><td colspan="5" class="muted">Todavía no hay movimientos.</td></tr>`}</table></div></div>`;}

/* Presupuesto */
function vPresupuesto(){const y=S.year,b=S.budgets[y]||{},[f,t]=yr(),m=balances(S,f,t,"reg:");let pi=0,ri=0,pe=0,re=0;
  const row=a=>{const inc=a.code[0]==="7",x=m[a.code]||{d:0,c:0},real=inc?r2(x.c-x.d):r2(x.d-x.c),p=b[a.code]||0;if(inc){pi=r2(pi+p);ri=r2(ri+real);}else{pe=r2(pe+p);re=r2(re+real);}
    const good=inc?real>=p:real<=p;
    return`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="n" style="width:150px"><input class="bud" type="number" step="any" min="0" data-acc="${a.code}" value="${p||""}" aria-label="Presupuesto ${a.code}" style="text-align:right"></td><td class="n">${eur(real)}</td><td class="n">${p?eur(r2(real-p)):""}</td><td class="n">${p?`<span class="pill ${good?"good":"bad"}">${Math.round(real/p*100)} %</span>`:""}</td></tr>`;};
  const inc=S.accounts.filter(a=>a.code[0]==="7").map(row).join(""),exp=S.accounts.filter(a=>a.code[0]==="6").map(row).join("");
  return`<div class="head"><h1>Presupuesto ${y}</h1></div><div class="card"><div class="tw"><table><tr><th>Cuenta</th><th>Nombre</th><th class="n">Presupuesto anual</th><th class="n">Real</th><th class="n">Desviación</th><th class="n">Ejecutado</th></tr>
  <tr class="sub"><td colspan="2">Ingresos</td><td class="n">${eur(pi)}</td><td class="n">${eur(ri)}</td><td class="n">${eur(r2(ri-pi))}</td><td></td></tr>${inc}
  <tr class="sub"><td colspan="2">Gastos</td><td class="n">${eur(pe)}</td><td class="n">${eur(re)}</td><td class="n">${eur(r2(re-pe))}</td><td></td></tr>${exp}
  <tr class="tot"><td colspan="2">Resultado</td><td class="n">${eur(r2(pi-pe))}</td><td class="n">${eur(r2(ri-re))}</td><td class="n">${eur(r2(ri-re-pi+pe))}</td><td></td></tr></table></div>
  <p class="small muted">Escribe el importe anual previsto en cada cuenta; se guarda al salir de la casilla.</p></div>`;}

/* Contactos */
function vContacts(){const q=norm(ui.cq||"").trim(),ty=ui.ct||"";
  const list=S.contacts.filter(c=>(!ty||c.type===ty)&&(!q||norm(c.name).startsWith(q)||norm(c.name).split(/\s+/).some(w=>w.startsWith(q))||norm(c.nif).startsWith(q)||(c.acc||"").startsWith(q)||norm(c.name).includes(q))).sort((a,b)=>(a.acc||"")<(b.acc||"")?-1:1);
  const rows=list.slice(0,300).map(c=>{const n=S.invoices.filter(i=>i.contactId===c.id),open=n.filter(i=>!i.paid).reduce((a,i)=>r2(a+invTotals(i).total),0);
  return`<tr><td><b>${esc(c.name)}</b></td><td>${c.acc?`<button class="link" data-act="mayor" data-acc="${c.acc}">${c.acc}</button>`:""}</td><td><span class="pill ${c.type==="cliente"?"neu":"warn"}">${c.type==="cliente"?"Cliente":"Proveedor"}</span></td><td>${esc(c.nif)} ${nifPill(c)}</td><td>${esc([c.city,c.province].filter(Boolean).join(", "))}</td><td>${esc(c.phone||"")}</td><td class="n">${n.length}</td><td class="n">${eur(open)}</td><td class="n"><button class="link" data-act="con-edit" data-id="${c.id}">Ficha</button><button class="link" data-act="con-del" data-id="${c.id}">Borrar</button></td></tr>`;}).join("");
  const miss=S.contacts.filter(c=>nifCheck(c.nif)==="empty"||(nifCheck(c.nif)==="bad"&&!c.foreign)).length;
  return`<div class="head"><h1>Clientes y proveedores</h1><button class="pri" data-act="con-edit" data-id="0">Nuevo contacto</button></div>
  <div class="row"><input id="con-q" data-live="cq" type="search" placeholder="Buscar por nombre, NIF o cuenta" value="${esc(ui.cq||"")}" style="max-width:340px" aria-label="Buscar contacto"><select id="con-t" style="width:auto" aria-label="Tipo"><option value="">Todos</option><option value="cliente" ${ty==="cliente"?"selected":""}>Clientes</option><option value="proveedor" ${ty==="proveedor"?"selected":""}>Proveedores</option></select><span class="small muted">${list.length} de ${S.contacts.length}</span></div>
  ${miss?`<div class="banner"><span>${miss} contactos sin NIF o con un NIF no válido. Complétalos: el NIF es necesario para el modelo 347.</span></div>`:""}
  <div class="card"><div class="tw"><table><tr><th>Nombre</th><th>Cuenta</th><th>Tipo</th><th>NIF</th><th>Población</th><th>Teléfono</th><th class="n">Facturas</th><th class="n">Saldo pendiente</th><th></th></tr>${rows||`<tr><td colspan="9" class="muted">${S.contacts.length?"Ningún contacto coincide con la búsqueda.":"Aún no hay contactos."}</td></tr>`}</table></div>${list.length>300?`<p class="small muted">Se muestran los 300 primeros. Afina la búsqueda para ver el resto.</p>`:""}</div>`;}
function conForm(id){const c=S.contacts.find(x=>x.id===id)||{id:0,type:ui.ct||"cliente",name:"",nif:"",address:"",cp:"",city:"",province:"",country:"España",phone:"",email:""},F=(k,l,extra)=>`<label>${l}<input id="c-${k}" value="${esc(c[k]||"")}" ${extra||""}></label>`;
  modal(`<form class="dlg" data-form="contact"><h2>${id?"Ficha de "+esc(c.name):"Nuevo contacto"}</h2><input type="hidden" id="c-id" value="${c.id}">
  <div class="form"><label>Tipo<select id="c-type"><option value="cliente" ${c.type==="cliente"?"selected":""}>Cliente</option><option value="proveedor" ${c.type==="proveedor"?"selected":""}>Proveedor</option></select></label>

function fail(msg){const e=$("#modal.open #f-err")||$("#f-err");if(e)e.textContent=msg;}
function done(){S.sample=S.sample&&false;save();closeModal();render();}
function ask(text,label,fn){modal(`<div class="dlg sm"><h2>Confirmar</h2><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cancelar</button><button class="pri" id="ask-ok">${esc(label)}</button></div></div>`);$("#ask-ok").onclick=()=>{fn();save();closeModal();render();};}
async function saveFile(name,text,mime){
  if(!EMBEDDED){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();return;}
  try{const d=window.claude&&await window.claude.use("downloads");if(d){await d.save({filename:name,data:text});return;}}catch(e){}
  modal(`<div class="dlg"><h2>${esc(name)}</h2><p class="small muted">Copia este contenido y guárdalo en un archivo con ese nombre.</p><textarea id="cp" rows="12" readonly>${esc(text)}</textarea><div class="row" style="justify-content:flex-end"><button id="cp-btn" class="pri">Copiar</button><button data-act="close">Cerrar</button></div></div>`);
  $("#cp-btn").onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>{$("#cp-btn").textContent="Copiado";},()=>{$("#cp").select();});}catch(e){$("#cp").select();}};}

  else if(a==="contracts-run"){const n=runContracts(S,TODAY);save();render();modal(`<div class="dlg sm"><h2>Facturación periódica</h2><p>${n?n+" facturas creadas y contabilizadas.":"No hay contratos con factura pendiente a día de hoy."}</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);}
  else if(a==="payroll-post"){const m=+$("#pay-month").value,e=postPayroll(S,S.year,m);save();render();modal(`<div class="dlg sm"><h2>Nóminas ${MES[m-1]} ${S.year}</h2><p>${e?"Asiento creado por un bruto de "+eur(e.lines[0].d)+". Si ya existía, se ha sustituido.":"No hay empleados con salario."}</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);}
  else if(a==="print"){try{window.print();}catch(e){}}
  else if(a==="export"){DB.lastExport=Date.now();save();saveFile("cuaderna-"+S.company.name.replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,"-")+"-"+TODAY+".json",JSON.stringify(S),"application/json");render();}
  else if(a==="export-all"){DB.lastExport=Date.now();save();saveFile("cuaderna-todas-las-empresas-"+TODAY+".json",JSON.stringify(DB),"application/json");render();}
  else if(a==="tbl-csv")saveFile("cuaderna-"+view()+"-"+TODAY+".csv","﻿"+$$("#main table tr").map(tr=>$$("th,td",tr).map(td=>{const i=$("input:not([type=checkbox]),select",td);return'"'+(i?i.value:td.textContent).replace(/\s+/g," ").trim().replace(/\s?€$/,"").replace(/"/g,'""')+'"';}).join(";")).join("\r\n"),"text/csv");
  else if(a==="imp-replace"){S=pend;pend=null;ensure();save();closeModal();render();}
  else if(a==="imp-new"){const d=pend;pend=null;newCompany(d);}
  else if(a==="co-del")ask("Se eliminará la empresa «"+S.company.name+"» con todos sus datos. Exporta antes una copia si la necesitas.","Eliminar empresa",()=>{delete DB.companies[DB.current];DB.current=Object.keys(DB.companies)[0];S=DB.companies[DB.current];ensure();});
  else if(a==="csv")saveFile("cuaderna-facturas-"+TODAY+".csv",csv(),"text/csv");
  else if(a==="sample")ask("Se sustituirán todos los datos actuales por datos de ejemplo.","Cargar ejemplo",()=>{S=sample(now.getFullYear(),TODAY);});
  else if(a==="wipe")ask("Se borrarán todas las facturas, contactos y asientos. Exporta antes una copia si la necesitas.","Borrar todo",()=>{const c=S.sample?null:S.company;S=blank(now.getFullYear());if(c)S.company=c;addBank(S,"Cuenta corriente");});
});
document.addEventListener("submit",ev=>{ev.preventDefault();const k=ev.target.dataset.form,v=id=>$("#"+id).value.trim();
  {const g=id=>{const e=$("#"+id);return e?e.value:null;},ie=S.invoices.find(i=>i.id===+(g("f-id")||g("p-id")||0)),ee=S.entries.find(x=>x.id===+(g("e-id")||0));
   const ds={entry:[g("e-date"),ee&&ee.date],invoice:[g("f-date"),ie&&ie.date,ie&&ie.paid],pay:[g("p-date"),ie&&ie.paid],mov:[g("m-date")]}[k];
   const bad=ds&&ds.find(isLocked);if(bad){fail(lockMsg(bad));return;}}
  if(k==="invoice")saveInvoice();
  else if(k==="pay"){payInvoice(S,S.invoices.find(i=>i.id===+v("p-id")),v("p-date"),v("p-bank"));done();}
  else if(k==="contact"){const foreign=$("#c-foreign").checked,nif=foreign?v("c-nif"):nifNorm(v("c-nif")),e=nifErr(nif,foreign);if(e)return fail(e);
    const dup=S.contacts.find(x=>x.id!==+v("c-id")&&x.type===v("c-type")&&nifNorm(x.nif)===nifNorm(nif));if(dup)return fail("Ya existe "+(dup.type==="cliente"?"un cliente":"un proveedor")+" con ese NIF: "+dup.name+".");
    let c=S.contacts.find(x=>x.id===+v("c-id"));if(!c){c={id:S.seq++};S.contacts.push(c);}const F=["address","cp","city","province","country","phone","email"];
    Object.assign(c,{type:v("c-type"),name:v("c-name"),nif,foreign});for(const f of F)c[f]=v("c-"+f);const ca=S.accounts.find(a=>a.code===contactAcc(S,c.id));if(ca)ca.name=c.name;done();}
  else if(k==="entry"){const ls=readEnt(),d=r2(ls.reduce((a,l)=>a+l.d,0)),c=r2(ls.reduce((a,l)=>a+l.c,0));if(!ls.length||d!==c)return fail("El asiento debe tener importes y cuadrar: debe = haber.");if(ls.some(l=>!l.acc||!S.accounts.some(a=>a.code===l.acc)))return fail("Elige en la lista la cuenta de cada línea con importe.");if($("#e-save").checked)S.templates.push({id:"u"+S.seq++,name:v("e-concept"),concept:v("e-concept"),lines:$$("#e-lines tr").map(tr=>({acc:$(".e-acc",tr).value,d:+$(".e-d",tr).value||0,c:+$(".e-c",tr).value||0}))});const eid=+v("e-id"),old=S.entries.find(e=>e.id===eid);
    if(old){const prev=old.lines;old.date=v("e-date");old.concept=v("e-concept");old.lines=ls.map((l,k)=>{const p=prev[k],n={acc:l.acc,d:r2(l.d),c:r2(l.c),contact:null};if(p&&p.acc===n.acc&&p.d===n.d&&p.c===n.c){n.ok=p.ok;n.contact=p.contact||null;}return n;});}
    else addEntry(S,v("e-date"),v("e-concept"),ls,"");const num=asNum(),sv=old||S.entries[S.entries.length-1];ui.flash=(old?"Asiento nº ":"Asiento nº ")+(num[sv.id]||"")+(old?" corregido.":" guardado.");ui.ed=null;done();}
  else if(k==="mov"){const amt=r2(+v("m-amount")),bk=v("m-bank"),ac=v("m-acc"),isIn=v("m-type")==="in";addEntry(S,v("m-date"),v("m-concept"),isIn?[{acc:bk,d:amt},{acc:ac,c:amt}]:[{acc:ac,d:amt},{acc:bk,c:amt}],"");ui.bank=bk;done();}
  else if(k==="doc"){const side=ev.target.dataset.side,lines=readLines();let cid=+v("f-contact");if(!lines.length)return fail("Añade al menos una línea.");
    if(!cid){const e=v("f-newname")?nifErr(v("f-newnif"),false):"";if(e)return fail(e);}
    if(!cid){const name=v("f-newname");if(!name)return fail("Elige un contacto o escribe el nombre del nuevo.");const c={id:S.seq++,type:side==="venta"?"cliente":"proveedor",name,nif:"",address:"",email:""};S.contacts.push(c);cid=c.id;}
    addDoc(S,{side,type:ui.doc[side],number:v("f-number"),date:v("f-date"),contactId:cid,lines});done();}
  else if(k==="crud"){const c=CR[ev.target.dataset.name],id=+v("k-id");let r=S[c.key].find(x=>x.id===id);if(!r){r={id:S.seq++};S[c.key].push(r);}
    for(const f of c.f){const x=v("k-"+f[0]);r[f[0]]=f[2]==="money"||f[2]==="number"||f[2]==="contact"?(+x||0):x;}done();}
  else if(k==="stock"){S.moves.push({id:S.seq++,date:v("q-date"),itemId:+v("q-id"),qty:+v("q-qty")||0,ref:v("q-ref")});done();}
  else if(k==="build"){const r=build(S,S.items.find(x=>x.id===+v("q-id")),+v("q-qty"),v("q-date"));if(!r.ok)return fail(r.missing.length?"El escandallo usa códigos que no existen o sin cantidad: "+r.missing.join(", "):"El escandallo está vacío.");done();}
  else if(k==="asset"){S.assets.push({id:S.seq++,name:v("x-name"),date:v("x-date"),cost:r2(+v("x-cost")),years:+v("x-years"),acc:v("x-acc")});done();}
  else if(k==="bank"){ui.bank=addBank(S,v("b-name")).acc;done();}
  else if(k==="renum"){const from=v("n-from"),to=v("n-to"),f=ev.target;if(to!==from&&S.accounts.some(a=>a.code===to)&&f.dataset.merge!==to){f.dataset.merge=to;$("#n-ok").textContent="Fusionar con "+to;return fail("La cuenta "+to+" ya existe ("+accName(to)+"). Si continúas, los movimientos de "+from+" pasarán a "+to+" y "+from+" desaparecerá.");}
    const r=renameAccount(S,from,to);if(!r.ok)return fail(r.msg);if(ui.bank===from)ui.bank=to;if(ui.mayor===from)ui.mayor=to;done();}
  else if(k==="account"){const code=v("a-code");if(code.length<S.digits)return;if(!S.accounts.some(a=>a.code===code)){S.accounts.push({code,name:v("a-name")});S.accounts.sort((a,b)=>a.code<b.code?-1:1);}save();render();}
  else if(k==="company"){Object.assign(S.company,{name:v("s-name"),nif:v("s-nif"),address:v("s-address"),type:v("s-type")});S.year=+v("s-year");save();render();}
});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.closest("[data-form=invoice],[data-form=doc]"))updTot();
  if(t.closest("[data-form=entry]"))updEnt();
  if(t.id==="n-to"){const f=t.closest("form");delete f.dataset.merge;$("#n-ok").textContent="Cambiar";fail("");}
  if(t.id==="flt"){ui.filter=t.value;const p=t.selectionStart;render();const n=$("#flt");n.focus();n.setSelectionRange(p,p);}
  if(t.dataset.live){ui[t.dataset.live]=t.value;const id=t.id,p=t.selectionStart;render();const n=$("#"+id);n.focus();try{n.setSelectionRange(p,p);}catch(e){}}
  if(t.id==="as-q"){ui.asq=t.value;$("#as-list").innerHTML=asList();}
  if(t.classList.contains("pk-in")){const box=t.closest(".pk"),h=$(".pk-val",box);if(!box.dataset.free){const src=box.dataset.src;h.value=(src==="cliente"||src==="proveedor")?"0":"";}pkOpen(t);updTot();}
  if(t.classList.contains("pk-val")){if(t.id==="f-contact"||t.id==="f-account")updTot();if(t.classList.contains("e-acc"))updEnt();}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="mayor-flt"){ui.mayor=t.value;render();}
  if(t.id==="lvl"){ui.lvl=+t.value;render();}
  if(t.id==="bsl"){ui.bsl=+t.value;render();}
  if(t.id==="psl"){ui.psl=+t.value;render();}
  if(t.id==="pfmt"){ui.pfmt=t.value;render();}
  if(t.id==="con-t"){ui.ct=t.value;render();}
  if(t.id==="imp-y"){S.year=+t.value;save();render();}
  if(t.id==="r-from"||t.id==="r-to"){if(t.value){ui[t.id==="r-from"?"from":"to"]=t.value;if(ui.from>ui.to)ui[t.id==="r-from"?"to":"from"]=t.value;render();}}
  if(t.id==="f-item"&&t.value){const i=S.items.find(x=>x.id===+t.value);$("#f-lines").insertAdjacentHTML("beforeend",lineRow({desc:i.name,qty:1,price:t.dataset.sale==="1"?i.price:i.cost,vat:+i.vat,itemId:i.id}));t.value="";updTot();}
  if(t.id==="csv-bank"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const rows=parseBankCsv(String(fr.result)),r=reconcile(S,ui.bank,rows);save();render();
    modal(`<div class="dlg"><h2>Conciliación con el extracto</h2><p>${rows.length} líneas leídas · <b>${r.n}</b> punteadas · <b>${r.un.length}</b> sin correspondencia en contabilidad.</p>${r.un.length?`<div class="tw"><table><tr><th>Fecha</th><th>Concepto</th><th class="n">Importe</th></tr>${r.un.slice(0,30).map(x=>`<tr><td>${fd(x.date)}</td><td>${esc(x.txt)}</td><td class="n">${eur(x.amt)}</td></tr>`).join("")}</table></div><p class="small muted">Registra estos movimientos (cobro o pago de factura, o movimiento manual) y vuelve a conciliar.</p>`:""}${rows.length?"":`<p class="err">No se reconoció ninguna línea. Usa un CSV con fecha (dd/mm/aaaa), concepto e importe.</p>`}<div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);};fr.readAsText(t.files[0]);}
  if(t.classList.contains("bud")){(S.budgets[S.year]=S.budgets[S.year]||{})[t.dataset.acc]=r2(+t.value||0);save();render();}
  if(t.classList.contains("chk")){const e=S.entries.find(x=>x.id===+t.dataset.e);if(e){e.lines[+t.dataset.k].ok=t.checked;save();render();}}
  if(t.id==="co-sel"){if(t.value==="+"){const c=blank(now.getFullYear());c.company.name="Nueva empresa";addBank(c,"Cuenta corriente");newCompany(c);location.hash="ajustes";}else useCompany(t.value);}
  if(t.id==="lq"){ui.lq=+t.value;render();}
  if(t.id==="e-tpl"&&t.value){const tp=S.templates.find(x=>String(x.id)===t.value);$("#e-concept").value=tp.concept;$("#e-lines").innerHTML=tp.lines.map(entRow).join("");updEnt();}
  if(t.id==="imp"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{let d=null;try{d=JSON.parse(fr.result);}catch(e){}
    const okS=x=>x&&Array.isArray(x.entries)&&Array.isArray(x.invoices)&&Array.isArray(x.accounts)&&x.company;
    if(d&&d.companies&&Object.keys(d.companies).length&&Object.values(d.companies).every(okS))ask("El archivo contiene "+Object.keys(d.companies).length+" empresas. Se sustituirán todas las empresas actuales por las del archivo.","Sustituir todo",()=>{DB=d;if(!DB.companies[DB.current])DB.current=Object.keys(DB.companies)[0];S=DB.companies[DB.current];ensure();});
    else if(okS(d)){pend=d;modal(`<div class="dlg sm"><h2>Importar «${esc(d.company.name)}»</h2><p>${d.invoices.length} facturas y ${d.entries.length} asientos. ¿Qué quieres hacer con esta copia?</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cancelar</button><button data-act="imp-new">Añadir como empresa nueva</button><button class="pri" data-act="imp-replace">Sustituir la empresa actual</button></div></div>`);}
    else modal(`<div class="dlg sm"><h2>No se pudo importar</h2><p>El archivo no es una copia de Cuaderna. Elige un .json exportado desde Ajustes.</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);t.value="";};fr.readAsText(t.files[0]);}
  if(t.id==="imp-inv"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const r=importInvoices(S,String(fr.result));save();render();
    modal(`<div class="dlg sm"><h2>Importación de facturas</h2><p><b>${r.n}</b> facturas importadas y contabilizadas. ${r.skip?`<b>${r.skip}</b> líneas omitidas por estar repetidas o incompletas.`:""}</p><div class="row" style="justify-content:flex-end"><button data-act="close">Cerrar</button></div></div>`);};fr.readAsText(t.files[0]);}
});
document.addEventListener("mousemove",ev=>{const tip=$("#tip");if(!tip)return;const h=ev.target.closest&&ev.target.closest(".hit");if(!h){tip.style.display="none";return;}
  const box=tip.parentElement.getBoundingClientRect();tip.textContent=h.dataset.tip;tip.style.display="block";
  tip.style.left=Math.max(0,Math.min(ev.clientX-box.left+12,box.width-tip.offsetWidth))+"px";tip.style.top=Math.max(0,ev.clientY-box.top-34)+"px";});
document.addEventListener("keydown",ev=>{const t=ev.target;
  if(t.classList&&t.classList.contains("pk-in")){const l=$(".pk-list",t.closest(".pk"));if(!l.hidden){const its=$$(".pk-it",l);let i=its.findIndex(x=>x.classList.contains("on"));
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ev.preventDefault();if(!its.length)return;if(i>=0)its[i].classList.remove("on");i=ev.key==="ArrowDown"?Math.min(its.length-1,i+1):Math.max(0,i-1);its[i].classList.add("on");its[i].scrollIntoView({block:"nearest"});return;}
    if(ev.key==="Enter"||(ev.key==="Tab"&&t.value.trim())){if(i>=0){if(ev.key==="Enter")ev.preventDefault();pkChoose(t,its[i]);}else if(ev.key==="Enter")ev.preventDefault();return;}
    if(ev.key==="Escape"){pkClose(t);return;}}
    else if(ev.key==="ArrowDown"){pkOpen(t);return;}else if(ev.key==="Enter"&&t.closest(".pk").dataset.free){return;}}
  if(ev.key==="Escape")closeModal();});
document.addEventListener("mousedown",ev=>{const it=ev.target.closest&&ev.target.closest(".pk-it");if(it&&pkCur){ev.preventDefault();pkChoose(pkCur,it);}});
document.addEventListener("focusin",ev=>{const t=ev.target;if(t.classList&&t.classList.contains("pk-in")&&t.closest(".pk").dataset.src!=="accfree")pkOpen(t);});
document.addEventListener("focusout",ev=>{const t=ev.target;if(t.classList&&t.classList.contains("pk-in"))setTimeout(()=>{if(document.activeElement!==t){pkBlur(t);pkClose(t);}},120);});
window.addEventListener("scroll",()=>{if(pkCur)pkClose(pkCur);},true);
window.addEventListener("hashchange",()=>{ui.filter="";closeModal();render();});
init();
</script>
